name: Publish CLI

# Dedicated tag, NOT the product "v*" release tag: the CLI depends on
# @e2a/sdk, and the SDKs publish on their own ts-sdk-v* / python-v* tags
# pushed after the product tag. Publishing the CLI from "v*" therefore
# always raced ahead of the SDK it was built against (observed on v1.5.0:
# @e2a/cli@2.2.0 hit npm ~4 minutes before @e2a/sdk@5.5.0). Push cli-v*
# after ts-sdk-v* so the SDK is installable first.
on:
  push:
    tags: ["cli-v*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false # never cancel a running publish

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci
      - run: npm run build --workspace @e2a/sdk
      - run: npm test --workspace @e2a/sdk
      - run: npm run build --workspace @e2a/cli
      - run: npm test --workspace @e2a/cli

  publish:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      # Node 24 ships with npm >= 11, which is the floor npm's trusted-publisher
      # OIDC flow requires (docs.npmjs.com/trusted-publishers: "npm CLI 11.5.1
      # or later and Node 22.14.0 or higher"). Node 20 + npm 10.x silently
      # skips the OIDC handshake and surfaces a misleading 404 PUT error
      # (npm/cli#9088, #8730).
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          registry-url: "https://registry.npmjs.org"

      - run: npm ci
      - run: npm run build --workspace @e2a/sdk
      - run: npm run build --workspace @e2a/cli

      - name: Publish to npm
        run: npm publish --workspace @e2a/cli --access public --provenance
