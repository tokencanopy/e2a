# Shared behavioral contract scenarios for the /v1 public API.
#
# The typed Huma /v1 surface (internal/httpapi) is the source of truth. The
# legacy gorilla/mux /api/v1 surface has been fully retired (Slice 8e), so every
# scenario here exercises /v1. The HITL magic-link pages moved to /v1/approve
# and /v1/reject (raw HTML, served via the chi root's fallback to the mux).
#
# Each scenario is a sequence of steps executed against a live test server.
# The Go runner (contract_test.go) and the TypeScript and Python SDK contract
# runners consume this file directly, so the format must remain
# language-agnostic.
#
# Setup helpers:
#   register_domain — claim a domain directly in the store
#   verify_domain   — mark a claimed domain verified in the store
#   register_agent  — create an agent through the public API
#   inject_message  — insert an inbound message directly in the store
#
# Step actions:
#   request          — make an HTTP request, assert status and optional body fields
#   inject_message   — insert an inbound message directly in the store
#   ws_connect       — open a WebSocket connection
#   ws_reconnect     — reconnect a WebSocket connection to trigger drain-on-reconnect
#   ws_read          — read and assert one WebSocket notification
#   verify_and_retry — verify a domain in the store, then replay an HTTP request
#
# Optional cleanup blocks contain request steps. Every runner executes them in
# declaration order after setup/steps, including after failures. Cleanup is
# best-effort: every request runs, the primary failure wins, and otherwise a
# cleanup failure fails the scenario.
#
# Placeholder tokens (resolved by runner at execution time):
#   {base_url}      — test server URL
#   {api_key}       — valid API key for the test user
#   {agent_email}   — agent email created by a prior register_agent setup step
#   {injected_message_id} — message ID created by a prior inject_message step

scenarios:

  - name: agent_crud
    description: Register, list, get (verify no leaked fields), delete agent
    setup:
      - register_domain: crud.test.dev
      - verify_domain: crud.test.dev
    steps:
      - id: register
        action: request
        method: POST
        path: /v1/agents
        body:
          email: bot@crud.test.dev
        expect:
          status: 201
          # AgentView dropped the redundant `id` (an agent's id IS its email),
          # so `email` is the sole identity key asserted here.
          body_contains:
            - email
          body_match:
            email: bot@crud.test.dev

      - id: list
        action: request
        method: GET
        path: /v1/agents
        expect:
          status: 200
          body_contains:
            - items
          body_match:
            "items[0].email": bot@crud.test.dev

      - id: get
        action: request
        method: GET
        path: /v1/agents/bot@crud.test.dev
        expect:
          status: 200
          # AgentView dropped `id` — email is the identity key.
          body_contains:
            - email
          body_excludes:
            - id
            - user_id
            - public
            - agent_mode
            - webhook_url

      - id: delete
        action: request
        method: DELETE
        path: /v1/agents/bot@crud.test.dev?confirm=DELETE
        # /v1 deleteAgent requires ?confirm=DELETE (AG-6); returns 200 with the
        # uniform deletion receipt {deleted:true, email, messages_deleted}.
        expect:
          status: 200
          body_match:
            deleted: true
            email: bot@crud.test.dev

      - id: list_after_delete
        action: request
        method: GET
        path: /v1/agents
        expect:
          status: 200
          body_match:
            "items.length": 0

  - name: domain_crud
    description: Register, list, verify, delete domain with typed responses
    steps:
      - id: register
        action: request
        method: POST
        path: /v1/domains
        body:
          domain: domain-crud.test.dev
        expect:
          status: 201
          body_contains:
            - domain
            - verified
            - capabilities
            - verification_token
            - dns_records
          body_match:
            domain: domain-crud.test.dev
            verified: false
            # capabilities is the per-axis rollup. inbound restates `verified`;
            # outbound restates the sending_status rollup, which is `none` here
            # because the contract server runs with the sending feature off
            # (no ses_region) — the same reason no mail_from records appear below.
            "capabilities.inbound": "pending"
            "capabilities.outbound": "none"
            # dns_records is now ONE purpose-tagged array (was an mx/txt/dkim
            # object). [0]=ownership, [1]=inbound_mx are always first; status
            # follows `verified` for inbound records (pending until verified).
            "dns_records[0].purpose": "ownership"
            "dns_records[0].type": "TXT"
            "dns_records[0].status": "pending"
            "dns_records[1].purpose": "inbound_mx"
            "dns_records[1].type": "MX"
            "dns_records[1].priority": 10

      - id: list
        action: request
        method: GET
        path: /v1/domains
        expect:
          status: 200
          body_match:
            "items.length": 1

      - id: verify
        action: request
        method: POST
        path: /v1/domains/domain-crud.test.dev/verify
        # In the dev/test harness (Production=false) the DNS probe short-
        # circuits TXTFound=true, so /v1 marks the domain verified and
        # returns 200 + verified=true.
        expect:
          status: 200
          body_match:
            verified: true

      # The axes move independently: verifying inbound flips capabilities.inbound
      # to verified while outbound stays where it was. VerifyDomainView has no
      # capabilities field (it speaks the live-probe vocabulary), so this pins the
      # post-verify state through GET, which is the documented poll target.
      - id: get_after_verify
        action: request
        method: GET
        path: /v1/domains/domain-crud.test.dev
        expect:
          status: 200
          body_contains:
            - capabilities
          body_match:
            verified: true
            "capabilities.inbound": "verified"
            "capabilities.outbound": "none"

      - id: delete
        action: request
        method: DELETE
        path: /v1/domains/domain-crud.test.dev?confirm=DELETE
        # /v1 deleteDomain requires ?confirm=DELETE (D-5); returns 200 with the
        # uniform deletion object {deleted:true, domain}.
        expect:
          status: 200
          body_match:
            deleted: true
            domain: domain-crud.test.dev

  - name: read_state_transition
    description: GET /messages/{id} marks unread messages as read
    setup:
      - register_domain: readstate.test.dev
      - verify_domain: readstate.test.dev
      - register_agent:
          email: bot@readstate.test.dev
      - inject_message:
          agent_email: "{agent_email}"
          from: alice@example.com
          subject: Test read state
    steps:
      - id: list_unread
        action: request
        method: GET
        path: /v1/agents/{agent_email}/messages?read_status=unread
        # /v1 listMessages returns the standardized cursor page
        # {"items":[...],"next_cursor":...} (not the legacy {"messages":[...]}).
        expect:
          status: 200
          body_match:
            "items.length": 1
            "items[0].read_status": unread

      - id: get_detail
        action: request
        method: GET
        path: /v1/agents/{agent_email}/messages/{injected_message_id}
        expect:
          status: 200
          body_match:
            header_from: alice@example.com
            envelope_from: alice@example.com
            verified_domain: example.com
            authentication.spf.status: pass
            authentication.spf.domain: example.com
            authentication.spf.aligned: true
            authentication.dkim.length: 0
            authentication.dmarc.status: pass
            authentication.dmarc.domain: example.com
            authentication.dmarc.policy: reject
            "authentication.dmarc.aligned_by[0]": spf

      - id: list_unread_after
        action: request
        method: GET
        path: /v1/agents/{agent_email}/messages?read_status=unread
        expect:
          status: 200
          body_match:
            "items.length": 0

      - id: list_read
        action: request
        method: GET
        path: /v1/agents/{agent_email}/messages?read_status=read
        expect:
          status: 200
          body_match:
            "items.length": 1
            "items[0].read_status": read

  - name: placeholder_resolution
    description: Placeholders resolve in request bodies and expected values
    setup:
      - register_domain: placeholder.test.dev
      - verify_domain: placeholder.test.dev
      - register_agent:
          email: bot@placeholder.test.dev
    steps:
      - id: duplicate_register_with_placeholder
        action: request
        method: POST
        path: /v1/agents
        body:
          email: "{agent_email}"
        expect:
          status: 409

      - id: list_agents_matches_placeholder
        action: request
        method: GET
        path: /v1/agents
        expect:
          status: 200
          body_match:
            "items[0].email": "{agent_email}"

  - name: auth_rejection
    description: Missing or invalid API keys get 401 across all endpoints
    auth_override: none
    steps:
      - id: no_auth_list_agents
        action: request
        method: GET
        path: /v1/agents
        # /v1 errors use the envelope {"error":{"code","message","request_id"}};
        # an unauthenticated call carries code=unauthorized.
        expect:
          status: 401
          body_match:
            "error.code": unauthorized

      - id: no_auth_create_agent
        action: request
        method: POST
        path: /v1/agents
        # Body is schema-valid so the request reaches the auth check (the
        # handler authenticates via requirePrincipal); this isolates the
        # auth dimension rather than tripping body validation (422) first.
        body:
          email: auth-probe@example.com
        expect:
          status: 401
          body_match:
            "error.code": unauthorized

      - id: no_auth_list_domains
        action: request
        method: GET
        path: /v1/domains
        expect:
          status: 401
          body_match:
            "error.code": unauthorized

      - id: no_auth_send
        action: request
        method: POST
        path: /v1/agents/bot@example.com/messages
        body:
          to: ["someone@example.com"]
          subject: probe
          text: probe
        expect:
          status: 401
          body_match:
            "error.code": unauthorized

  - name: auth_rejection_invalid_key
    description: Invalid API key gets 401 across all endpoints
    auth_override: "Bearer e2a_invalid_key_12345"
    steps:
      - id: invalid_key_list_agents
        action: request
        method: GET
        path: /v1/agents
        expect:
          status: 401
          body_match:
            "error.code": unauthorized

      - id: invalid_key_create_agent
        action: request
        method: POST
        path: /v1/agents
        body:
          email: auth-probe@example.com
        expect:
          status: 401
          body_match:
            "error.code": unauthorized

      - id: invalid_key_list_domains
        action: request
        method: GET
        path: /v1/domains
        expect:
          status: 401
          body_match:
            "error.code": unauthorized

      - id: invalid_key_send
        action: request
        method: POST
        path: /v1/agents/bot@example.com/messages
        body:
          to: ["someone@example.com"]
          subject: probe
          text: probe
        expect:
          status: 401
          body_match:
            "error.code": unauthorized

  - name: domain_verification_enforced
    description: Agent registration blocked on unverified domain
    setup:
      - register_domain: unverified.test.dev
    steps:
      - id: register_on_unverified
        action: request
        method: POST
        path: /v1/agents
        body:
          email: bot@unverified.test.dev
        # /v1 createAgent rejects an unverified (but claimed) domain with a
        # 400 envelope carrying code=domain_not_verified.
        expect:
          status: 400
          body_match:
            "error.code": domain_not_verified

      - id: verify_then_register
        action: verify_and_retry
        verify_domain: unverified.test.dev
        method: POST
        path: /v1/agents
        body:
          email: bot@unverified.test.dev
        expect:
          status: 201

  - name: ws_notification_shape
    description: >
      WebSocket drain-on-reconnect delivers frames in the versioned event
      envelope — {type, id, schema_version, created_at, data} — carrying the
      email.received data payload (the same shape as a webhook delivery).
      Notification-only protocol: server sends events, client never sends
      application frames.
    setup:
      - register_domain: ws.test.dev
      - verify_domain: ws.test.dev
      - register_agent:
          email: bot@ws.test.dev
    steps:
      - id: connect
        action: ws_connect
        path: /v1/agents/{agent_email}/ws

      - id: inject
        action: inject_message
        agent_email: "{agent_email}"
        from: alice@example.com
        subject: WS test

      - id: reconnect
        action: ws_reconnect
        path: /v1/agents/{agent_email}/ws

      - id: read_notification
        action: ws_read
        expect:
          fields_present:
            - type
            - id
            - schema_version
            - created_at
            - data.message_id
            - data.header_from
            - data.envelope_from
            - data.authentication
            - data.delivered_to
            - data.agent_email
            - data.direction
            - data.subject
            - data.received_at
          fields_absent:
            - data.body
            - data.raw_message
            - data.from
            - data.authenticated_from
            - data.auth
            - data.auth_headers
          field_match:
            type: email.received
            schema_version: "1"
            data.header_from: alice@example.com
            data.envelope_from: alice@example.com
            data.delivered_to: "{agent_email}"
            data.agent_email: "{agent_email}"
            data.direction: inbound
            data.subject: WS test

  - name: health_check
    description: Health endpoint is available without auth
    steps:
      - id: health
        action: request
        method: GET
        path: /api/health
        auth_override: none
        expect:
          status: 200

  - name: hitl_send_holds_202
    description: >
      With an outbound review policy on the agent (outbound_policy=allowlist +
      outbound_policy_action=review, empty allowlist → every recipient unknown),
      POST /send returns 202 + status=pending_review + approval_expires_at.
      (hitl_enabled was retired — holds now come from the screening policy.)
    setup:
      - register_domain: hitl-hold.test.dev
      - verify_domain: hitl-hold.test.dev
      - register_agent:
          email: bot@hitl-hold.test.dev
    steps:
      - id: enable_outbound_review
        # Screening config lives on the account-scoped /protection sub-resource
        # (PUT, full replace). An empty-allowlist outbound review gate holds every send.
        action: request
        method: PUT
        path: /v1/agents/{agent_email}/protection
        body:
          inbound:
            gate: {}
            scan: {}
          outbound:
            gate:
              policy: allowlist
              action: review
              allowlist: []
            scan: {}
          holds: {}
        expect:
          status: 200
          body_match:
            outbound.gate.action: review

      - id: send_held
        action: request
        method: POST
        path: /v1/agents/{agent_email}/messages
        body:
          to:
            - alice@example.com
          subject: Hold me
          text: please review before sending
        expect:
          status: 202
          body_contains:
            - status
            - message_id
            - approval_expires_at
          body_match:
            status: pending_review

  - name: hitl_reject_records_reason
    description: >
      Reject endpoint accepts a reason in the body and surfaces it. Catches the
      chunked-body regression (rejection reason was silently dropped when
      ContentLength was unknown). Uses the outbound review policy to hold the send
      (hitl_enabled retired); reject yields the unified status=review_rejected.
    setup:
      - register_domain: hitl-reject.test.dev
      - verify_domain: hitl-reject.test.dev
      - register_agent:
          email: bot@hitl-reject.test.dev
    steps:
      - id: enable_outbound_review
        action: request
        method: PUT
        path: /v1/agents/{agent_email}/protection
        body:
          inbound:
            gate: {}
            scan: {}
          outbound:
            gate:
              policy: allowlist
              action: review
              allowlist: []
            scan: {}
          holds: {}
        expect:
          status: 200

      - id: send_held
        action: request
        method: POST
        path: /v1/agents/{agent_email}/messages
        body:
          to:
            - alice@example.com
          subject: To be rejected
          text: this should never go out
        expect:
          status: 202
          body_contains:
            - message_id
        capture:
          held_id: message_id

      - id: reject
        # Reject is the account-scoped review-queue operation
        # (POST /v1/reviews/{id}/reject) — a review's id IS the held message's
        # id, so no inbox email is needed. RejectResultView surfaces
        # {status, message_id, rejection_reason}. Status is the unified
        # review_rejected (was the outbound-only 'rejected'). The deprecated
        # agent-path reject route was removed in the pre-GA vocabulary freeze.
        action: request
        method: POST
        path: /v1/reviews/{held_id}/reject
        body:
          reason: off-topic for this audience
        expect:
          status: 200
          body_match:
            status: review_rejected
            rejection_reason: off-topic for this audience

  - name: messages_direction_all_shape
    description: >
      GET /agents/{email}/messages?direction=all returns the dashboard-
      inbox shape: every row carries `direction`, outbound rows carry
      `review_status` and `webhook_status`. Catches the H1 SDK contract
      drift if httpapi.MessageSummaryView falls out of sync with the
      handler again.
    setup:
      - register_domain: mixed.test.dev
      - verify_domain: mixed.test.dev
      - register_agent:
          email: bot@mixed.test.dev
      - inject_message:
          agent_email: "{agent_email}"
          from: external@example.com
          subject: an inbound row
    steps:
      - id: enable_outbound_review
        action: request
        method: PUT
        path: /v1/agents/{agent_email}/protection
        body:
          inbound:
            gate: {}
            scan: {}
          outbound:
            gate:
              policy: allowlist
              action: review
              allowlist: []
            scan: {}
          holds: {}
        expect:
          status: 200

      - id: outbound_held
        action: request
        method: POST
        path: /v1/agents/{agent_email}/messages
        body:
          to:
            - someone@example.com
          subject: an outbound row
          text: pending
        expect:
          status: 202

      - id: list_mixed
        # /v1 listMessages: cursor page envelope ({"items":[...]}), page-size
        # param is `limit` (not legacy `page_size`). MessageSummaryView keeps
        # the per-row `direction`; outbound rows carry `review_status`.
        action: request
        method: GET
        path: /v1/agents/{agent_email}/messages?direction=all&limit=10
        expect:
          status: 200
          body_contains:
            - items
          # Two rows — the order is most-recent-first so the outbound
          # held row lands at index 0.
          body_match:
            "items.length": 2
            "items[0].direction": outbound
            "items[0].review_status": pending_review
            "items[1].direction": inbound

  - name: agent_suppression_and_managed_unsubscribe
    description: >
      The beta agent-suppression CRUD surface blocks the exact recipient until
      deletion, and managed unsubscribe is accepted by the live send endpoint.
      All setup is performed through public requests so every SDK contract
      runner executes this scenario rather than skipping store-backed setup.
    steps:
      - id: register_domain
        action: request
        method: POST
        path: /v1/domains
        body:
          domain: suppression-contract.test.dev
        expect:
          status: 201

      - id: verify_domain
        action: request
        method: POST
        path: /v1/domains/suppression-contract.test.dev/verify
        expect:
          status: 200
          body_match:
            verified: true

      - id: register_agent
        action: request
        method: POST
        path: /v1/agents
        body:
          email: bot@suppression-contract.test.dev
        expect:
          status: 201
          body_match:
            email: bot@suppression-contract.test.dev

      - id: create_suppression
        action: request
        method: POST
        path: /v1/agents/bot@suppression-contract.test.dev/suppressions
        body:
          address: recipient@example.net
          reason: contract test
        expect:
          status: 200
          body_match:
            agent_email: bot@suppression-contract.test.dev
            address: recipient@example.net
            source: manual

      - id: list_suppressions
        action: request
        method: GET
        path: /v1/agents/bot@suppression-contract.test.dev/suppressions
        expect:
          status: 200
          body_match:
            "items.length": 1
            "items[0].address": recipient@example.net

      - id: suppressed_send_refused
        action: request
        method: POST
        path: /v1/agents/bot@suppression-contract.test.dev/messages
        body:
          to:
            - Recipient <recipient@example.net>
          subject: blocked by agent suppression
          text: must not be accepted
        expect:
          status: 422
          body_match:
            "error.code": recipient_suppressed

      - id: delete_suppression
        action: request
        method: DELETE
        path: /v1/agents/bot@suppression-contract.test.dev/suppressions/recipient@example.net?confirm=DELETE
        expect:
          status: 200
          body_match:
            deleted: true
            address: recipient@example.net

      - id: enable_outbound_review
        action: request
        method: PUT
        path: /v1/agents/bot@suppression-contract.test.dev/protection
        body:
          inbound:
            gate: {}
            scan: {}
          outbound:
            gate:
              policy: allowlist
              action: review
              allowlist: []
            scan: {}
          holds: {}
        expect:
          status: 200

      - id: managed_unsubscribe_send_held
        action: request
        method: POST
        path: /v1/agents/bot@suppression-contract.test.dev/messages
        body:
          to:
            - recipient@example.net
          subject: managed unsubscribe contract
          text: held for review
          unsubscribe:
            mode: managed
        expect:
          status: 202
          body_match:
            status: pending_review
        capture:
          managed_message_id: message_id

      - id: get_managed_message_lifecycle
        action: request
        method: GET
        path: /v1/agents/bot@suppression-contract.test.dev/messages/{managed_message_id}/lifecycle
        expect:
          status: 200
          body_match:
            "items.length": 2
          # Both observations share the accept transaction's timestamp. The
          # wire contract therefore orders them by stable transition ID, not
          # by stage, so assert the canonical review row independent of index.
          body_array_contains:
            items:
              message_id: "{managed_message_id}"
              direction: outbound
              stage: review
              outcome: pending
              reason_code: review.hold_created
              retryable: false
              reconstructed: false

    cleanup:
      - id: delete_agent_permanently
        action: request
        method: DELETE
        path: /v1/agents/bot@suppression-contract.test.dev?confirm=DELETE&permanent=true
        expect:
          status: 200
          body_match:
            deleted: true
            email: bot@suppression-contract.test.dev

      - id: delete_domain
        action: request
        method: DELETE
        path: /v1/domains/suppression-contract.test.dev?confirm=DELETE
        expect:
          status: 200
          body_match:
            deleted: true
            domain: suppression-contract.test.dev

  - name: info_unauthenticated_shape
    description: >
      GET /v1/info is the deployment-discovery endpoint — works
      without auth and surfaces shared_domain / slug_registration_enabled
      / public_url. Catches drift in the DeploymentInfoView struct.
    auth_override: none
    steps:
      - id: info
        action: request
        method: GET
        path: /v1/info
        expect:
          status: 200
          body_contains:
            - shared_domain
            - slug_registration_enabled

  - name: ws_auth_rejection
    description: WebSocket endpoint rejects a missing or invalid Authorization Bearer credential
    setup:
      - register_domain: wsauth.test.dev
      - verify_domain: wsauth.test.dev
      - register_agent:
          email: bot@wsauth.test.dev
    steps:
      - id: no_auth
        action: request
        method: GET
        path: /v1/agents/bot@wsauth.test.dev/ws
        auth_override: none
        expect:
          status: 401

      - id: invalid_bearer
        action: request
        method: GET
        path: /v1/agents/bot@wsauth.test.dev/ws
        auth_override: "Bearer invalid_key_12345"
        expect:
          status: 401

      - id: query_token_rejected
        # The legacy ?token= query is no longer accepted — only the header.
        action: request
        method: GET
        path: /v1/agents/bot@wsauth.test.dev/ws?token=invalid_key_12345
        auth_override: none
        expect:
          status: 401

  - name: messages_list_filter
    description: >
      The beta `filter` query parameter on listMessages narrows results by
      subject, from, label, and created with boolean composition (OR, AND,
      implicit AND, NOT and its "-" shorthand, parentheses, and the documented
      NOT > OR > implicit AND > explicit AND precedence), exact ("=", "!=")
      versus substring (":") matching with wildcard and quoted values, ANDs
      with the flat filters, rejects unknown fields, malformed expressions,
      and unsupported operators with invalid_filter, and binds the raw filter
      into pagination cursors (changed or dropped filter on continuation is
      invalid_cursor). All setup goes through public requests so every SDK
      contract runner executes this scenario rather than skipping
      store-backed setup. Percent-encoding in paths (%20 space, %3D =, %22
      quote, %28 paren) is deliberate: it is exactly what a real client must
      send over the wire.
    steps:
      - id: register_domain
        action: request
        method: POST
        path: /v1/domains
        body:
          domain: filter-contract.test.dev
        expect:
          status: 201

      - id: verify_domain
        action: request
        method: POST
        path: /v1/domains/filter-contract.test.dev/verify
        expect:
          status: 200
          body_match:
            verified: true

      - id: register_agent
        action: request
        method: POST
        path: /v1/agents
        body:
          email: bot@filter-contract.test.dev
        expect:
          status: 201
          body_match:
            email: bot@filter-contract.test.dev

      - id: enable_outbound_review
        # The contract harness has no outbound delivery queue, so an accepted
        # send 500s (outbound delivery queue unavailable). The HITL hold path
        # persists the same outbound rows synchronously without the queue, so
        # the scenario gates every send into pending_review — the rows are
        # listable and label-able like any other outbound message.
        action: request
        method: PUT
        path: /v1/agents/bot@filter-contract.test.dev/protection
        body:
          inbound:
            gate: {}
            scan: {}
          outbound:
            gate:
              policy: allowlist
              action: review
              allowlist: []
            scan: {}
          holds: {}
        expect:
          status: 200

      - id: send_alpha
        action: request
        method: POST
        path: /v1/agents/bot@filter-contract.test.dev/messages
        body:
          to:
            - recipient@example.net
          subject: Filter contract AlphaToken
          text: alpha body
        expect:
          status: 202
          body_match:
            status: pending_review
        capture:
          alpha_message_id: message_id

      - id: send_beta
        action: request
        method: POST
        path: /v1/agents/bot@filter-contract.test.dev/messages
        body:
          to:
            - recipient@example.net
          subject: Filter contract BetaToken
          text: beta body
        expect:
          status: 202
          body_match:
            status: pending_review

      - id: label_alpha
        action: request
        method: PATCH
        path: /v1/agents/bot@filter-contract.test.dev/messages/{alpha_message_id}
        body:
          add_labels:
            - contracttag
        expect:
          status: 200
          body_match:
            "labels[0]": contracttag

      - id: list_all
        action: request
        method: GET
        path: /v1/agents/bot@filter-contract.test.dev/messages?direction=outbound
        expect:
          status: 200
          body_match:
            "items.length": 2

      - id: filter_subject
        action: request
        method: GET
        path: /v1/agents/bot@filter-contract.test.dev/messages?direction=outbound&filter=subject:AlphaToken
        expect:
          status: 200
          body_match:
            "items.length": 1
            "items[0].subject": Filter contract AlphaToken

      - id: filter_subject_quoted
        # Quoted values may contain whitespace; ":" stays a substring match.
        action: request
        method: GET
        path: /v1/agents/bot@filter-contract.test.dev/messages?direction=outbound&filter=subject:%22contract%20AlphaToken%22
        expect:
          status: 200
          body_match:
            "items.length": 1
            "items[0].subject": Filter contract AlphaToken

      - id: filter_subject_exact
        action: request
        method: GET
        path: /v1/agents/bot@filter-contract.test.dev/messages?direction=outbound&filter=subject%20%3D%20%22Filter%20contract%20BetaToken%22
        expect:
          status: 200
          body_match:
            "items.length": 1
            "items[0].subject": Filter contract BetaToken

      - id: filter_subject_not_exact
        action: request
        method: GET
        path: /v1/agents/bot@filter-contract.test.dev/messages?direction=outbound&filter=subject%20%21%3D%20%22Filter%20contract%20AlphaToken%22
        expect:
          status: 200
          body_match:
            "items.length": 1
            "items[0].subject": Filter contract BetaToken

      - id: filter_from_match
        # Outbound rows send as the agent itself: ILIKE substring on sender.
        action: request
        method: GET
        path: /v1/agents/bot@filter-contract.test.dev/messages?direction=outbound&filter=from:filter-contract
        expect:
          status: 200
          body_match:
            "items.length": 2

      - id: filter_from_no_match
        action: request
        method: GET
        path: /v1/agents/bot@filter-contract.test.dev/messages?direction=outbound&filter=from:alice
        expect:
          status: 200
          body_match:
            "items.length": 0

      - id: filter_from_wildcard
        # "*" matches any sequence in ":" values.
        action: request
        method: GET
        path: /v1/agents/bot@filter-contract.test.dev/messages?direction=outbound&filter=from:*@filter-contract.test.dev
        expect:
          status: 200
          body_match:
            "items.length": 2

      - id: filter_from_exact_case_insensitive
        # "=" is case-insensitive EXACT matching on the sender (%3D, %22 are
        # the wire encoding a real client must send for = and ").
        action: request
        method: GET
        path: /v1/agents/bot@filter-contract.test.dev/messages?direction=outbound&filter=from%20%3D%20%22Bot@Filter-Contract.Test.Dev%22
        expect:
          status: 200
          body_match:
            "items.length": 2

      - id: filter_from_exact_substring_rejected
        # Exact match must NOT substring-match: the local part alone is not
        # the full sender, so "=" finds nothing where ":" would match both.
        action: request
        method: GET
        path: /v1/agents/bot@filter-contract.test.dev/messages?direction=outbound&filter=from%20%3D%20%22bot%22
        expect:
          status: 200
          body_match:
            "items.length": 0

      - id: filter_from_not_exact
        action: request
        method: GET
        path: /v1/agents/bot@filter-contract.test.dev/messages?direction=outbound&filter=from%20%21%3D%20%22bot@filter-contract.test.dev%22
        expect:
          status: 200
          body_match:
            "items.length": 0

      - id: filter_label
        action: request
        method: GET
        path: /v1/agents/bot@filter-contract.test.dev/messages?direction=outbound&filter=label:contracttag
        expect:
          status: 200
          body_match:
            "items.length": 1
            "items[0].subject": Filter contract AlphaToken

      - id: filter_label_no_match
        action: request
        method: GET
        path: /v1/agents/bot@filter-contract.test.dev/messages?direction=outbound&filter=label:nosuchtag
        expect:
          status: 200
          body_match:
            "items.length": 0

      - id: filter_or
        action: request
        method: GET
        path: /v1/agents/bot@filter-contract.test.dev/messages?direction=outbound&filter=subject:AlphaToken%20OR%20subject:BetaToken
        expect:
          status: 200
          body_match:
            "items.length": 2

      - id: filter_not
        action: request
        method: GET
        path: /v1/agents/bot@filter-contract.test.dev/messages?direction=outbound&filter=NOT%20label:contracttag
        expect:
          status: 200
          body_match:
            "items.length": 1
            "items[0].subject": Filter contract BetaToken

      - id: filter_not_dash_prefix
        # "-" is the documented shorthand for NOT.
        action: request
        method: GET
        path: /v1/agents/bot@filter-contract.test.dev/messages?direction=outbound&filter=-label:contracttag
        expect:
          status: 200
          body_match:
            "items.length": 1
            "items[0].subject": Filter contract BetaToken

      - id: filter_and
        action: request
        method: GET
        path: /v1/agents/bot@filter-contract.test.dev/messages?direction=outbound&filter=subject:AlphaToken%20AND%20label:contracttag
        expect:
          status: 200
          body_match:
            "items.length": 1
            "items[0].subject": Filter contract AlphaToken

      - id: filter_and_no_match
        # BetaToken carries no label, so the AND is empty.
        action: request
        method: GET
        path: /v1/agents/bot@filter-contract.test.dev/messages?direction=outbound&filter=subject:BetaToken%20AND%20label:contracttag
        expect:
          status: 200
          body_match:
            "items.length": 0

      - id: filter_implicit_and
        # Whitespace between expressions is the documented implicit AND.
        action: request
        method: GET
        path: /v1/agents/bot@filter-contract.test.dev/messages?direction=outbound&filter=subject:AlphaToken%20label:contracttag
        expect:
          status: 200
          body_match:
            "items.length": 1
            "items[0].subject": Filter contract AlphaToken

      - id: filter_parens
        action: request
        method: GET
        path: /v1/agents/bot@filter-contract.test.dev/messages?direction=outbound&filter=%28subject:AlphaToken%20OR%20subject:BetaToken%29%20AND%20label:contracttag
        expect:
          status: 200
          body_match:
            "items.length": 1
            "items[0].subject": Filter contract AlphaToken

      - id: filter_precedence_or_before_implicit_and
        # Documented precedence is NOT > OR > implicit AND > explicit AND, so
        # this parses as (BetaToken OR AlphaToken) AND label:contracttag — only
        # AlphaToken carries the label. A naive AND-before-OR reading would
        # return both messages.
        action: request
        method: GET
        path: /v1/agents/bot@filter-contract.test.dev/messages?direction=outbound&filter=subject:BetaToken%20OR%20subject:AlphaToken%20label:contracttag
        expect:
          status: 200
          body_match:
            "items.length": 1
            "items[0].subject": Filter contract AlphaToken

      - id: filter_and_flat_composition
        # The flat labels filter ANDs with the expression: BetaToken matches
        # the expression but carries no label, so the composition is empty.
        action: request
        method: GET
        path: /v1/agents/bot@filter-contract.test.dev/messages?direction=outbound&labels=contracttag&filter=subject:BetaToken
        expect:
          status: 200
          body_match:
            "items.length": 0

      - id: filter_created_on_or_after
        action: request
        method: GET
        path: /v1/agents/bot@filter-contract.test.dev/messages?direction=outbound&filter=created%3E=2020-01-01
        expect:
          status: 200
          body_match:
            "items.length": 2

      - id: filter_created_before
        action: request
        method: GET
        path: /v1/agents/bot@filter-contract.test.dev/messages?direction=outbound&filter=created%3C2020-01-01
        expect:
          status: 200
          body_match:
            "items.length": 0

      - id: filter_unknown_field_rejected
        # has:attachment is deliberately not a v1 field.
        action: request
        method: GET
        path: /v1/agents/bot@filter-contract.test.dev/messages?direction=outbound&filter=has:attachment
        expect:
          status: 400
          body_match:
            "error.code": invalid_filter

      - id: filter_malformed_rejected
        # Unbalanced parenthesis (%28) must not parse.
        action: request
        method: GET
        path: /v1/agents/bot@filter-contract.test.dev/messages?direction=outbound&filter=%28subject:AlphaToken
        expect:
          status: 400
          body_match:
            "error.code": invalid_filter

      - id: filter_operator_rejected
        # label only supports ":" — "=" (%3D) is a validation error, not a
        # silent different meaning.
        action: request
        method: GET
        path: /v1/agents/bot@filter-contract.test.dev/messages?direction=outbound&filter=label%3Dcontracttag
        expect:
          status: 400
          body_match:
            "error.code": invalid_filter

      - id: filter_cursor_page1
        action: request
        method: GET
        path: /v1/agents/bot@filter-contract.test.dev/messages?direction=outbound&limit=1&filter=created%3E=2020-01-01
        expect:
          status: 200
          body_match:
            "items.length": 1
        capture:
          filter_cursor: next_cursor

      - id: filter_cursor_page2_same_filter
        action: request
        method: GET
        path: /v1/agents/bot@filter-contract.test.dev/messages?direction=outbound&limit=1&filter=created%3E=2020-01-01&cursor={filter_cursor}
        expect:
          status: 200
          body_match:
            "items.length": 1

      - id: filter_cursor_changed_filter_rejected
        action: request
        method: GET
        path: /v1/agents/bot@filter-contract.test.dev/messages?direction=outbound&limit=1&filter=subject:BetaToken&cursor={filter_cursor}
        expect:
          status: 400
          body_match:
            "error.code": invalid_cursor

      - id: filter_cursor_dropped_filter_rejected
        action: request
        method: GET
        path: /v1/agents/bot@filter-contract.test.dev/messages?direction=outbound&limit=1&cursor={filter_cursor}
        expect:
          status: 400
          body_match:
            "error.code": invalid_cursor

    cleanup:
      - id: delete_agent_permanently
        action: request
        method: DELETE
        path: /v1/agents/bot@filter-contract.test.dev?confirm=DELETE&permanent=true
        expect:
          status: 200
          body_match:
            deleted: true
            email: bot@filter-contract.test.dev

      - id: delete_domain
        action: request
        method: DELETE
        path: /v1/domains/filter-contract.test.dev?confirm=DELETE
        expect:
          status: 200
          body_match:
            deleted: true
            domain: filter-contract.test.dev
