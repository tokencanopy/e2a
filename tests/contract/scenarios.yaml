  - name: scheduled_send_at_validation
    description: >
      send_at edge validation is identical across send, reply, and forward: a
      value more than 90 days ahead is a 400 invalid_request that never
      persists a message, and a value at/before now is treated as an ordinary
      immediate send (202 accepted, no scheduled_at). The far-future and past
      literals are deliberately fixed calendar instants — always >90 days out
      and always in the past for any realistic run date. The reply/forward
      target is an injected inbound (same seeding constraint as
      scheduled_reply_fields; runners without store access skip this).
    setup:
      - register_agent:
          email: scheduled-validation-{scenario_token}@agents.e2a.dev
      - inject_message:
          agent_email: "{agent_email}"
          from: alice@example.net
          subject: validation reply target
    steps:
      - id: send_beyond_horizon_rejected
        action: request
        method: POST
        path: /v1/agents/{agent_email}/messages
        body:
          to:
            - recipient@example.net
          subject: over-horizon send
          text: never persisted
          send_at: "2099-01-01T00:00:00Z"
        expect:
          status: 400
          body_match:
            "error.code": invalid_request

      - id: reply_beyond_horizon_rejected
        action: request
        method: POST
        path: /v1/agents/{agent_email}/messages/{injected_message_id}/reply
        body:
          text: over-horizon reply
          send_at: "2099-01-01T00:00:00Z"
        expect:
          status: 400
          body_match:
            "error.code": invalid_request

      - id: forward_beyond_horizon_rejected
        action: request
        method: POST
        path: /v1/agents/{agent_email}/messages/{injected_message_id}/forward
        body:
          to:
            - recipient@example.net
          text: over-horizon forward
          send_at: "2099-01-01T00:00:00Z"
        expect:
          status: 400
          body_match:
            "error.code": invalid_request

      - id: past_send_at_is_immediate
        action: request
        method: POST
        path: /v1/agents/{agent_email}/messages
        body:
          to:
            - recipient@example.net
          subject: past send_at sends now
          text: immediate
          send_at: "2020-01-01T00:00:00Z"
        expect:
          status: 202
          body_match:
            status: accepted
          body_excludes:
            - scheduled_at
        capture:
          immediate_message_id: message_id

      - id: past_send_at_projection_has_no_scheduled_at
        action: request
        method: GET
        path: /v1/agents/{agent_email}/messages/{immediate_message_id}
        expect:
          status: 200
          body_match:
            id: "{immediate_message_id}"
          body_excludes:
            - scheduled_at

    cleanup:
      - id: delete_validation_agent_permanently
        action: request
        method: DELETE
        path: /v1/agents/{agent_email}?confirm=DELETE&permanent=true
        expect:
          status: 200
          body_match:
            deleted: true
            email: "{agent_email}"

  - name: reply_to_address_list
    description: >
      reply_to accepts EITHER a single RFC 5322 address (the historical form)
      OR an array of addresses (RFC 5322 Reply-To is an address-list). Both
      shapes are accepted end-to-end; a bad member in the list is rejected at
      the edge with 400 invalid_request. Proves the send/reply/forward request
      contract widened compatibly (see the oneOf on reply_to in openapi.yaml).
      The agent lives on the shared domain (no custom-domain verify_domain
      setup), so this scenario runs in the Go, TypeScript, and Python contract
      runners alike instead of being store-seeded and skipped in TS/Python.
    setup:
      - register_agent:
          email: bot-reply-to-{scenario_token}@agents.e2a.dev
    steps:
      - id: send_reply_to_array
        action: request
        method: POST
        path: /v1/agents/{agent_email}/messages
        body:
          to:
            - recipient@example.net
          subject: reply_to as an address-list
          text: replies fan out to several destinations
          reply_to:
            - "Support <support@example.com>"
            - owner@example.com
        expect:
          status: 202
          body_match:
            status: accepted

      - id: send_reply_to_single_string
        action: request
        method: POST
        path: /v1/agents/{agent_email}/messages
        body:
          to:
            - recipient@example.net
          subject: reply_to as a single string still works
          text: backward-compatible single address
          reply_to: "Support <support@example.com>"
        expect:
          status: 202
          body_match:
            status: accepted

      - id: send_reply_to_bad_member_rejected
        action: request
        method: POST
        path: /v1/agents/{agent_email}/messages
        body:
          to:
            - recipient@example.net
          subject: one bad reply_to member rejects the whole request
          text: should 400
          reply_to:
            - ok@example.com
            - not an address
        expect:
          status: 400
          body_match:
            "error.code": invalid_request

    cleanup:
      - id: delete_reply_to_agent_permanently
        action: request
        method: DELETE
        path: /v1/agents/{agent_email}?confirm=DELETE&permanent=true
        expect:
          status: 200
          body_match:
            deleted: true
            email: "{agent_email}"

