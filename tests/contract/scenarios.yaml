  - name: contacts_crud
    description: >
      Contact identity is account-level and keyed by the CANONICAL address.
      The create here deliberately sends an RFC 5322 mailbox — the shape a
      spreadsheet export produces — and every later step addresses the same
      contact by its bare form, so an SDK that forwards the raw input or
      mangles the encoded path fails here rather than in production.
    steps:
      - id: create
        action: request
        method: POST
        path: /v1/contacts
        body:
          address: "A. Partner <Partner@Fund.VC>"
          display_name: A. Partner
          metadata:
            fund: Example Capital
        expect:
          status: 201
          body_contains:
            - address
            - source
          body_match:
            address: partner@fund.vc
            display_name: A. Partner
            source: manual

      - id: duplicate_is_conflict
        action: request
        method: POST
        path: /v1/contacts
        body:
          address: partner@fund.vc
        expect:
          status: 409

      - id: get_by_bare_address
        action: request
        method: GET
        path: /v1/contacts/partner@fund.vc
        expect:
          status: 200
          body_match:
            address: partner@fund.vc
            display_name: A. Partner

      - id: patch_keeps_metadata
        action: request
        method: PATCH
        path: /v1/contacts/partner@fund.vc
        body:
          display_name: Renamed
        expect:
          status: 200
          body_match:
            display_name: Renamed
            "metadata.fund": Example Capital

      - id: list
        action: request
        method: GET
        path: /v1/contacts
        expect:
          status: 200
          body_contains:
            - items
            - next_cursor

      - id: delete_requires_confirm
        action: request
        method: DELETE
        path: /v1/contacts/partner@fund.vc
        expect:
          status: 422

      - id: delete
        action: request
        method: DELETE
        path: /v1/contacts/partner@fund.vc?confirm=DELETE
        expect:
          status: 200
          body_match:
            deleted: true

      - id: gone
        action: request
        method: GET
        path: /v1/contacts/partner@fund.vc
        expect:
          status: 404

  - name: contacts_import
    description: >
      Bulk import returns a per-row outcome so one bad line never rejects the
      upload. The batch mixes a valid row, an unparseable address, and a
      case-variant duplicate of the first — each must be reported against its
      own index, which is what lets a caller reconcile a spreadsheet line by
      line. The reversal then removes only what the batch created.
    steps:
      - id: import
        action: request
        method: POST
        path: /v1/contacts/import
        body:
          contacts:
            - address: "First <First@Imp.VC>"
              display_name: First
            - address: not-an-email
            - address: FIRST@imp.vc
            - address: "Second <Second@Imp.VC>"
              display_name: Second
        capture:
          batch_id: batch_id
        expect:
          status: 200
          body_contains:
            - batch_id
            - results
          body_match:
            created: 2
            failed: 1
            skipped: 1
            "results[0].status": created
            "results[0].address": first@imp.vc
            "results[1].status": failed
            "results[2].status": skipped
            "results[2].code": duplicate_in_batch
            "results[3].status": created
            "results[3].address": second@imp.vc

      - id: imported_contact_is_readable
        action: request
        method: GET
        path: /v1/contacts/first@imp.vc
        expect:
          status: 200
          body_match:
            source: import

      - id: filter_by_source
        action: request
        method: GET
        path: /v1/contacts?source=import
        expect:
          status: 200
          body_array_contains:
            items:
              address: first@imp.vc

      - id: empty_batch_rejected
        action: request
        method: POST
        path: /v1/contacts/import
        body:
          contacts: []
        expect:
          status: 422

      - id: null_contacts_rejected
        action: request
        method: POST
        path: /v1/contacts/import
        body:
          contacts: null
        expect:
          status: 422

      - id: missing_contacts_rejected
        action: request
        method: POST
        path: /v1/contacts/import
        body: {}
        expect:
          status: 422

      # A contact edited after the import no longer belongs solely to the
      # batch: reversal must remove the untouched row and keep the edited one,
      # and the receipt's deleted + retained must account for both.
      - id: edit_protects_from_reversal
        action: request
        method: PATCH
        path: /v1/contacts/second@imp.vc
        body:
          display_name: Second, Edited
        expect:
          status: 200

      - id: reverse_batch
        action: request
        method: DELETE
        path: /v1/contacts/imports/{batch_id}?confirm=DELETE
        expect:
          status: 200
          body_match:
            deleted: true
            contacts_deleted: 1
            contacts_retained: 1

      - id: untouched_contact_reversed
        action: request
        method: GET
        path: /v1/contacts/first@imp.vc
        expect:
          status: 404

      - id: edited_contact_survives
        action: request
        method: GET
        path: /v1/contacts/second@imp.vc
        expect:
          status: 200
          body_match:
            display_name: Second, Edited

    cleanup:
      # Best-effort (no expect): after a passing run the reversal already
      # removed first@imp.vc (404 here); after a mid-scenario failure this is
      # what keeps the scenario self-cleaning for the next run.
      - id: delete_first_contact_if_reversed
        action: request
        method: DELETE
        path: /v1/contacts/first@imp.vc?confirm=DELETE
      - action: request
        method: DELETE
        path: /v1/contacts/second@imp.vc?confirm=DELETE
        expect:
          status: 200

  - name: contacts_import_row_length_isolation
    description: >
      Per-row isolation for content-LENGTH violations. The 320-code-point
      bounds on address and display_name used to be item-level maxLength in
      the request schema, where one over-long spreadsheet cell rejected the
      whole upload with 422 and nothing imported. They are now per-row
      handler checks like every other content rule: the batch answers 200,
      the offending row alone reports failed with invalid_request, and its
      valid neighbours import. The over-long display_name row sits BETWEEN
      two valid rows — exactly the shape the schema bound used to reject
      wholesale. The reversal then removes what the batch created.
    steps:
      - id: import_with_overlong_row
        action: request
        method: POST
        path: /v1/contacts/import
        body:
          contacts:
            - address: iso-one@imp.vc
              display_name: Iso One
            - address: iso-long@imp.vc
              # 336 code points — over the 320 bound this row alone must fail on.
              display_name: "Much-Too-Long-Much-Too-Long-Much-Too-Long-Much-Too-Long-Much-Too-Long-Much-Too-Long-Much-Too-Long-Much-Too-Long-Much-Too-Long-Much-Too-Long-Much-Too-Long-Much-Too-Long-Much-Too-Long-Much-Too-Long-Much-Too-Long-Much-Too-Long-Much-Too-Long-Much-Too-Long-Much-Too-Long-Much-Too-Long-Much-Too-Long-Much-Too-Long-Much-Too-Long-Much-Too-Long-"
            - address: iso-two@imp.vc
              display_name: Iso Two
        capture:
          batch_id: batch_id
        expect:
          status: 200
          body_contains:
            - batch_id
            - results
          body_match:
            created: 2
            failed: 1
            skipped: 0
            "results[0].status": created
            "results[0].address": iso-one@imp.vc
            "results[1].status": failed
            "results[1].code": invalid_request
            "results[1].address": iso-long@imp.vc
            "results[2].status": created
            "results[2].address": iso-two@imp.vc

      - id: first_neighbour_imported
        action: request
        method: GET
        path: /v1/contacts/iso-one@imp.vc
        expect:
          status: 200
          body_match:
            display_name: Iso One
            source: import

      - id: failed_row_left_no_contact
        action: request
        method: GET
        path: /v1/contacts/iso-long@imp.vc
        expect:
          status: 404

      - id: second_neighbour_imported
        action: request
        method: GET
        path: /v1/contacts/iso-two@imp.vc
        expect:
          status: 200
          body_match:
            display_name: Iso Two

      - id: reverse_batch
        action: request
        method: DELETE
        path: /v1/contacts/imports/{batch_id}?confirm=DELETE
        expect:
          status: 200
          body_match:
            deleted: true
            contacts_deleted: 2
            contacts_retained: 0

    cleanup:
      # Best-effort (no expect): after a passing run the reversal already
      # removed both rows (404 here); after a mid-scenario failure these are
      # what keep the scenario self-cleaning for the next run.
      - action: request
        method: DELETE
        path: /v1/contacts/iso-one@imp.vc?confirm=DELETE
      - action: request
        method: DELETE
        path: /v1/contacts/iso-two@imp.vc?confirm=DELETE

  - name: contact_outreach
    description: >
      Per-agent outreach state. Enrolment creates the contact if absent, a
      partial update leaves the other agent-owned field alone (advancing a
      stage must not clear the schedule), derived fields are server-owned and
      rejected on write, and un-enrolling removes the outreach record while
      the account-level contact survives.
    setup:
      - register_domain: outreach.test.dev
      - verify_domain: outreach.test.dev
      - register_agent:
          email: raise@outreach.test.dev
    steps:
      - id: enrol
        action: request
        method: PUT
        path: /v1/agents/raise@outreach.test.dev/contacts/investor@fund.vc
        body:
          stage: touch1
          next_action_at: "2026-08-01T09:00:00Z"
        expect:
          status: 201
          body_contains:
            - stage
            - replied
            - suppressed
            - contact
          body_match:
            address: investor@fund.vc
            stage: touch1
            replied: false

      - id: stage_only_update_keeps_schedule
        action: request
        method: PUT
        path: /v1/agents/raise@outreach.test.dev/contacts/investor@fund.vc
        body:
          stage: touch2
        expect:
          status: 200
          body_contains:
            - next_action_at
          body_match:
            stage: touch2

      - id: derived_fields_are_server_owned
        action: request
        method: PUT
        path: /v1/agents/raise@outreach.test.dev/contacts/investor@fund.vc
        body:
          replied: true
        expect:
          status: 422

      - id: outreach_query
        action: request
        method: GET
        path: /v1/agents/raise@outreach.test.dev/contacts?replied=false
        expect:
          status: 200
          body_match:
            "items[0].address": investor@fund.vc
            "items[0].stage": touch2

      - id: unenrol
        action: request
        method: DELETE
        path: /v1/agents/raise@outreach.test.dev/contacts/investor@fund.vc?confirm=DELETE
        expect:
          status: 200
          body_match:
            deleted: true

      - id: contact_survives_unenrolment
        action: request
        method: GET
        path: /v1/contacts/investor@fund.vc
        expect:
          status: 200

    cleanup:
      - action: request
        method: DELETE
        path: /v1/contacts/investor@fund.vc?confirm=DELETE
        expect:
          status: 200

  - name: cursor_binding_foreign_cursor_rejected
    description: >
      Pagination cursors are bound to the exact query that minted them — the
      collection, its parent path parameters, its filters, and the minting
      account. Replaying a genuinely minted cursor anywhere else must surface
      400 invalid_cursor, never a silently mispositioned (typically empty)
      200 page. The runners share a single test account, so the cross-account
      replay cannot be staged in this DSL; that axis binds via the MAC key
      and is deliberately indistinguishable from the forged-cursor case
      asserted last here — its two-account matrix lives in
      internal/httpapi/cursor_binding_test.go.
    steps:
      # Two contacts so a limit=1 first page yields a real continuation cursor.
      - id: seed_first
        action: request
        method: POST
        path: /v1/contacts
        body:
          address: cursor-a@bind.vc
        expect:
          status: 201

      - id: seed_second
        action: request
        method: POST
        path: /v1/contacts
        body:
          address: cursor-b@bind.vc
        expect:
          status: 201

      - id: mint
        action: request
        method: GET
        path: /v1/contacts?limit=1
        expect:
          status: 200
          body_match:
            "items.length": 1
        capture:
          contacts_cursor: next_cursor

      - id: foreign_endpoint_rejected
        # A real /v1/contacts cursor presented to /v1/agents: pre-binding this
        # verified (same HMAC secret, same keyset shape) and anchored the
        # agents query at a meaningless position; now it is a 400.
        action: request
        method: GET
        path: /v1/agents?cursor={contacts_cursor}
        expect:
          status: 400
          body_match:
            "error.code": invalid_cursor

      - id: own_continuation_still_walks
        action: request
        method: GET
        path: /v1/contacts?limit=1&cursor={contacts_cursor}
        expect:
          status: 200
          body_match:
            "items.length": 1

      - id: forged_cursor_rejected
        # The same surface a foreign ACCOUNT's cursor produces: a plain MAC
        # failure, indistinguishable from tampering.
        action: request
        method: GET
        path: /v1/contacts?cursor=not-a-real-cursor
        expect:
          status: 400
          body_match:
            "error.code": invalid_cursor

    cleanup:
      - action: request
        method: DELETE
        path: /v1/contacts/cursor-a@bind.vc?confirm=DELETE
        expect:
          status: 200
      - action: request
        method: DELETE
        path: /v1/contacts/cursor-b@bind.vc?confirm=DELETE
        expect:
          status: 200

  - name: invalid_utf8_rejected
    description: >
      Well-formed-text rule: no client-supplied string may carry an invalid
      UTF-8 byte sequence, whichever seam it arrives through — raw request
      body, path param, query param or header. Every arm answers 400
      invalid_request located at the offending field: never a 5xx, and never a
      silent U+FFFD substitution (JSON decoders launder invalid bytes into the
      replacement character before any field-level check can see them, which
      is why the body arm is enforced on the RAW bytes before decoding).

      The body and header arms cannot be written as YAML scalars: YAML is
      UTF-8 by definition and its \xFF escape denotes codepoint U+00FF, which
      encodes to the perfectly VALID two-byte sequence C3 BF. They therefore
      use raw_body_base64 / headers_base64, which every runner decodes to
      bytes and transmits verbatim. The path and query arms need no escape
      hatch — %FF is pure ASCII on the wire.

      Self-cleaning by construction: every request is a rejection, so nothing
      is ever created and there is nothing to delete. The two probe steps
      assert exactly that, including for the LAUNDERED address (a + U+FFFD +
      b) that the pre-fix server persisted with a 201.
    steps:
      - id: path_param_rotate_secret_rejected
        # Was a 500 "failed to rotate webhook secret": the raw byte reached
        # the store's UPDATE and Postgres refused it (SQLSTATE 22021).
        action: request
        method: POST
        path: /v1/webhooks/%FF/rotate-secret
        expect:
          status: 400
          body_match:
            "error.code": invalid_request
            "error.details.fields[0].location": path.id
            "error.details.fields[0].message": must be valid UTF-8
          # Whole-response check: the envelope must not echo the offending
          # input back at ANY depth. Since the envelope is JSON and JSON is
          # UTF-8, an echo can only arrive laundered, so the absence of the
          # replacement character is the general form of "nothing leaked".
          response_excludes: ["\uFFFD"]

      - id: path_param_get_webhook_rejected
        # The read path masked the same defect as a 404; the blanket rule
        # makes it the same actionable 400.
        action: request
        method: GET
        path: /v1/webhooks/%FF
        expect:
          status: 400
          body_match:
            "error.code": invalid_request
            "error.details.fields[0].location": path.id
            "error.details.fields[0].message": must be valid UTF-8
          response_excludes: ["\uFFFD"]

      - id: query_param_rejected
        action: request
        method: GET
        path: /v1/contacts?import_batch_id=%FF
        expect:
          status: 400
          body_match:
            "error.code": invalid_request
            "error.details.fields[0].location": query.import_batch_id
            "error.details.fields[0].message": must be valid UTF-8
          response_excludes: ["\uFFFD"]

      - id: body_rejected
        # Decodes to {"address":"a\xFFb@example.com","display_name":"invalid
        # utf8 body"} with a raw 0xFF byte inside the address. Pre-fix this
        # answered 201 and stored the address with U+FFFD in place of the
        # byte — the corruption nothing downstream can ever see.
        action: request
        method: POST
        path: /v1/contacts
        raw_body_base64: eyJhZGRyZXNzIjoiYf9iQGV4YW1wbGUuY29tIiwiZGlzcGxheV9uYW1lIjoiaW52YWxpZCB1dGY4IGJvZHkifQ==
        expect:
          status: 400
          body_match:
            "error.code": invalid_request
            "error.details.fields[0].location": body
            "error.details.fields[0].message": request body must be valid UTF-8
          # The envelope must not echo the offending body back. This has to be
          # the WHOLE-response form: huma's ErrorDetail carries the raw value
          # at error.details.fields[].value, so a leak would sit nested and a
          # top-level `body_excludes: [address]` would pass vacuously on an
          # error envelope that has no top-level `address` key either way.
          # Named substrings first, then the general laundered-echo check.
          response_excludes:
            - "example.com"
            - "invalid utf8 body"
            - "\uFFFD"

      - id: laundered_body_address_was_not_created
        # a + U+FFFD + b @example.com, percent-encoded. This is the address
        # the pre-fix 201 actually persisted, so a 404 here is the proof that
        # the rejection left no row.
        action: request
        method: GET
        path: /v1/contacts/a%EF%BF%BDb@example.com
        expect:
          status: 404
          body_match:
            "error.code": contact_not_found

      - id: header_rejected
        # Idempotency-Key: k\xFFz (base64 "a/96"). Pre-fix the raw byte
        # reached the idempotency store and came back as a 500 "idempotency
        # store error". The BODY here is deliberately valid, so the header is
        # the only thing that can be rejected.
        action: request
        method: POST
        path: /v1/contacts
        body:
          address: hdr-utf8-{scenario_token}@example.com
        headers_base64:
          Idempotency-Key: a/96
        expect:
          status: 400
          body_match:
            "error.code": invalid_request
            "error.details.fields[0].location": header.Idempotency-Key
            "error.details.fields[0].message": must be valid UTF-8
          response_excludes: ["\uFFFD"]

      - id: header_rejected_contact_was_not_created
        action: request
        method: GET
        path: /v1/contacts/hdr-utf8-{scenario_token}@example.com
        expect:
          status: 404
          body_match:
            "error.code": contact_not_found

  - name: account_limits_enforced
    description: >
      Plan caps are enforced on the create paths and surface as a 402
      limit_exceeded envelope carrying the resource, the cap, the plan code and
      the upgrade URL — the fields an SDK needs to tell a caller WHICH quota
      stopped them and how to get out of it. The two resources carry DIFFERENT
      caps (domains 1, agents 2) so a single hardcoded number cannot satisfy
      both. `current` is asserted too, but note it is NOT independently proven
      here: at the moment of refusal `current == limit` by definition of the
      `count >= cap` check, so only an over-cap account (a downgrade) could
      distinguish them. Tracked separately. Everything here runs as a SECOND, permanently
      capped account (auth_override with {capped_api_key}) that the contract
      server seeds at startup with max_domains 1 / max_agents 1. Nothing
      mutates a cap, so this scenario cannot leak enforcement into the ones
      that follow — which is the whole reason the caps are a separate account
      instead of a limits-seeding step: both the TS and Python runners
      silently ignore setup keys they do not recognize, so a "reset the caps"
      cleanup that one runner skipped would 402 every later scenario.
      Until this existed, no limit path in the product was covered by any
      live-server test in any language (the contract server deliberately set
      caps to 100000, per the comment in testutil.StartContractServer).
    steps:
      # The capped account starts empty, so its single domain slot is free.
      - id: first_domain_fits_the_cap
        action: request
        method: POST
        path: /v1/domains
        auth_override: "Bearer {capped_api_key}"
        body:
          domain: capped-{scenario_token}.test.dev
        expect:
          status: 201
          body_match:
            domain: capped-{scenario_token}.test.dev

      # The cap bites, and says so in a machine-readable way: an SDK surfacing
      # only "402" leaves the caller guessing which of four quotas they hit.
      - id: second_domain_hits_the_cap
        action: request
        method: POST
        path: /v1/domains
        auth_override: "Bearer {capped_api_key}"
        body:
          domain: capped-2-{scenario_token}.test.dev
        expect:
          status: 402
          body_match:
            "error.code": limit_exceeded
            "error.details.resource": domains
            "error.details.limit": 1
            "error.details.current": 1
            # The upgrade affordance is the whole point of a 402: without a
            # plan code and a URL the caller hits a paywall with nowhere to go.
            # Both are `omitempty`, so dropping them server-side is invisible
            # unless something asserts them.
            "error.details.plan_code": contract_capped
            "error.details.upgrade_url": https://e2a.dev/upgrade

      # The exemption (#811 / #819): a same-owner re-register creates nothing —
      # the claim returns the existing row — so the CREATE cap must not apply
      # to it. Pre-fix this 402'd, failing an SDK retry of a request the server
      # had already satisfied. This step is the reason the account is capped at
      # exactly 1: the account is provably AT its cap on the line above.
      - id: reregister_owned_domain_at_cap_is_allowed
        action: request
        method: POST
        path: /v1/domains
        auth_override: "Bearer {capped_api_key}"
        body:
          domain: capped-{scenario_token}.test.dev
        expect:
          status: 201
          body_match:
            domain: capped-{scenario_token}.test.dev

      # A DIFFERENT resource with a DIFFERENT cap, so a passing suite cannot
      # come from one quota being wired while the others are not, nor from a
      # hardcoded "1" anywhere in the envelope. The shared domain needs no
      # verification, so the agent cap is reachable over pure HTTP in every
      # runner.
      - id: first_agent_fits_the_cap
        action: request
        method: POST
        path: /v1/agents
        auth_override: "Bearer {capped_api_key}"
        body:
          email: capped-bot-{scenario_token}@agents.e2a.dev
        expect:
          status: 201
          body_match:
            email: capped-bot-{scenario_token}@agents.e2a.dev

      - id: second_agent_fits_the_cap
        action: request
        method: POST
        path: /v1/agents
        auth_override: "Bearer {capped_api_key}"
        body:
          email: capped-bot-2-{scenario_token}@agents.e2a.dev
        expect:
          status: 201

      - id: third_agent_hits_the_cap
        action: request
        method: POST
        path: /v1/agents
        auth_override: "Bearer {capped_api_key}"
        body:
          email: capped-bot-3-{scenario_token}@agents.e2a.dev
        expect:
          status: 402
          body_match:
            "error.code": limit_exceeded
            "error.details.resource": agents
            "error.details.limit": 2
            "error.details.current": 2
            "error.details.plan_code": contract_capped

      # The cap is a cap, not a wall: freeing the slot makes the create work
      # again. Without this, a server that 402'd unconditionally would pass
      # every assertion above.
      - id: agent_slot_frees_on_delete
        action: request
        method: DELETE
        path: /v1/agents/capped-bot-{scenario_token}@agents.e2a.dev?confirm=DELETE&permanent=true
        auth_override: "Bearer {capped_api_key}"
        expect:
          status: 200
          body_match:
            deleted: true

      - id: agent_create_succeeds_again_after_freeing_a_slot
        action: request
        method: POST
        path: /v1/agents
        auth_override: "Bearer {capped_api_key}"
        body:
          email: capped-bot-3-{scenario_token}@agents.e2a.dev
        expect:
          status: 201

    cleanup:
      # Self-cleaning is load-bearing here, not tidiness: the capped account
      # has a handful of slots, so anything left behind puts the NEXT run at
      # its cap on an early step — and a scenario that fails at step one with
      # "the cap fired on the first create" reads exactly like a product bug.
      #
      # EVERY agent the scenario can create is deleted here, including
      # capped-bot-1, which the happy path already removed in
      # agent_slot_frees_on_delete: steps stop at the first failure, so a
      # failure between that create and that delete would otherwise strand it.
      # These carry no `expect` precisely so an already-deleted agent's 404 is
      # not itself a cleanup failure.
      - id: delete_agent_1
        action: request
        method: DELETE
        path: /v1/agents/capped-bot-{scenario_token}@agents.e2a.dev?confirm=DELETE&permanent=true
        auth_override: "Bearer {capped_api_key}"

      - id: delete_agent_2
        action: request
        method: DELETE
        path: /v1/agents/capped-bot-2-{scenario_token}@agents.e2a.dev?confirm=DELETE&permanent=true
        auth_override: "Bearer {capped_api_key}"

      - id: delete_agent_3
        action: request
        method: DELETE
        path: /v1/agents/capped-bot-3-{scenario_token}@agents.e2a.dev?confirm=DELETE&permanent=true
        auth_override: "Bearer {capped_api_key}"

      - id: delete_domain
        action: request
        method: DELETE
        path: /v1/domains/capped-{scenario_token}.test.dev?confirm=DELETE
        auth_override: "Bearer {capped_api_key}"

  - name: messages_list_filter
    description: >
      The beta `filter` query parameter on listMessages narrows results by
      subject, from, label, and created with boolean composition (OR, AND,
      implicit AND, NOT and its "-" shorthand, parentheses, and the documented
      NOT > OR > implicit AND > explicit AND precedence), exact ("=", "!=")
      versus substring (":") matching with wildcard and quoted values, ANDs
      with the flat filters, rejects unknown fields, malformed expressions,
      and unsupported operators with invalid_filter, and binds the raw filter
      into pagination cursors (changed or dropped filter on continuation is
      invalid_cursor). All setup goes through public requests so every SDK
      contract runner executes this scenario rather than skipping
      store-backed setup. Percent-encoding in paths (%20 space, %3D =, %22
      quote, %28 paren) is deliberate: it is exactly what a real client must
      send over the wire.
    steps:
      - id: register_domain
        action: request
        method: POST
        path: /v1/domains
        body:
          domain: filter-contract.test.dev
        expect:
          status: 201

      - id: verify_domain
        action: request
        method: POST
        path: /v1/domains/filter-contract.test.dev/verify
        expect:
          status: 200
          body_match:
            verified: true

      - id: register_agent
        action: request
        method: POST
        path: /v1/agents
        body:
          email: bot@filter-contract.test.dev
        expect:
          status: 201
          body_match:
            email: bot@filter-contract.test.dev

      - id: enable_outbound_review
        # The contract harness has no outbound delivery queue, so an accepted
        # send 500s (outbound delivery queue unavailable). The HITL hold path
        # persists the same outbound rows synchronously without the queue, so
        # the scenario gates every send into pending_review — the rows are
        # listable and label-able like any other outbound message.
        action: request
        method: PUT
        path: /v1/agents/bot@filter-contract.test.dev/protection
        body:
          inbound:
            gate: {}
            scan: {}
          outbound:
            gate:
              policy: allowlist
              action: review
              allowlist: []
            scan: {}
          holds: {}
        expect:
          status: 200

      - id: send_alpha
        action: request
        method: POST
        path: /v1/agents/bot@filter-contract.test.dev/messages
        body:
          to:
            - recipient@example.net
          subject: Filter contract AlphaToken
          text: alpha body
        expect:
          status: 202
          body_match:
            status: pending_review
        capture:
          alpha_message_id: message_id

      - id: send_beta
        action: request
        method: POST
        path: /v1/agents/bot@filter-contract.test.dev/messages
        body:
          to:
            - recipient@example.net
          subject: Filter contract BetaToken
          text: beta body
        expect:
          status: 202
          body_match:
            status: pending_review

      - id: label_alpha
        action: request
        method: PATCH
        path: /v1/agents/bot@filter-contract.test.dev/messages/{alpha_message_id}
        body:
          add_labels:
            - contracttag
        expect:
          status: 200
          body_match:
            "labels[0]": contracttag

      - id: list_all
        action: request
        method: GET
        path: /v1/agents/bot@filter-contract.test.dev/messages?direction=outbound
        expect:
          status: 200
          body_match:
            "items.length": 2

      - id: filter_subject
        action: request
        method: GET
        path: /v1/agents/bot@filter-contract.test.dev/messages?direction=outbound&filter=subject:AlphaToken
        expect:
          status: 200
          body_match:
            "items.length": 1
            "items[0].subject": Filter contract AlphaToken

      - id: filter_subject_quoted
        # Quoted values may contain whitespace; ":" stays a substring match.
        action: request
        method: GET
        path: /v1/agents/bot@filter-contract.test.dev/messages?direction=outbound&filter=subject:%22contract%20AlphaToken%22
        expect:
          status: 200
          body_match:
            "items.length": 1
            "items[0].subject": Filter contract AlphaToken

      - id: filter_subject_exact
        action: request
        method: GET
        path: /v1/agents/bot@filter-contract.test.dev/messages?direction=outbound&filter=subject%20%3D%20%22Filter%20contract%20BetaToken%22
        expect:
          status: 200
          body_match:
            "items.length": 1
            "items[0].subject": Filter contract BetaToken

      - id: filter_subject_not_exact
        action: request
        method: GET
        path: /v1/agents/bot@filter-contract.test.dev/messages?direction=outbound&filter=subject%20%21%3D%20%22Filter%20contract%20AlphaToken%22
        expect:
          status: 200
          body_match:
            "items.length": 1
            "items[0].subject": Filter contract BetaToken

      - id: filter_from_match
        # Outbound rows send as the agent itself: ILIKE substring on sender.
        action: request
        method: GET
        path: /v1/agents/bot@filter-contract.test.dev/messages?direction=outbound&filter=from:filter-contract
        expect:
          status: 200
          body_match:
            "items.length": 2

      - id: filter_from_no_match
        action: request
        method: GET
        path: /v1/agents/bot@filter-contract.test.dev/messages?direction=outbound&filter=from:alice
        expect:
          status: 200
          body_match:
            "items.length": 0

      - id: filter_from_wildcard
        # "*" matches any sequence in ":" values.
        action: request
        method: GET
        path: /v1/agents/bot@filter-contract.test.dev/messages?direction=outbound&filter=from:*@filter-contract.test.dev
        expect:
          status: 200
          body_match:
            "items.length": 2

      - id: filter_from_exact_case_insensitive
        # "=" is case-insensitive EXACT matching on the sender (%3D, %22 are
        # the wire encoding a real client must send for = and ").
        action: request
        method: GET
        path: /v1/agents/bot@filter-contract.test.dev/messages?direction=outbound&filter=from%20%3D%20%22Bot@Filter-Contract.Test.Dev%22
        expect:
          status: 200
          body_match:
            "items.length": 2

      - id: filter_from_exact_substring_rejected
        # Exact match must NOT substring-match: the local part alone is not
        # the full sender, so "=" finds nothing where ":" would match both.
        action: request
        method: GET
        path: /v1/agents/bot@filter-contract.test.dev/messages?direction=outbound&filter=from%20%3D%20%22bot%22
        expect:
          status: 200
          body_match:
            "items.length": 0

      - id: filter_from_not_exact
        action: request
        method: GET
        path: /v1/agents/bot@filter-contract.test.dev/messages?direction=outbound&filter=from%20%21%3D%20%22bot@filter-contract.test.dev%22
        expect:
          status: 200
          body_match:
            "items.length": 0

      - id: filter_label
        action: request
        method: GET
        path: /v1/agents/bot@filter-contract.test.dev/messages?direction=outbound&filter=label:contracttag
        expect:
          status: 200
          body_match:
            "items.length": 1
            "items[0].subject": Filter contract AlphaToken

      - id: filter_label_no_match
        action: request
        method: GET
        path: /v1/agents/bot@filter-contract.test.dev/messages?direction=outbound&filter=label:nosuchtag
        expect:
          status: 200
          body_match:
            "items.length": 0

      - id: filter_or
        action: request
        method: GET
        path: /v1/agents/bot@filter-contract.test.dev/messages?direction=outbound&filter=subject:AlphaToken%20OR%20subject:BetaToken
        expect:
          status: 200
          body_match:
            "items.length": 2

      - id: filter_not
        action: request
        method: GET
        path: /v1/agents/bot@filter-contract.test.dev/messages?direction=outbound&filter=NOT%20label:contracttag
        expect:
          status: 200
          body_match:
            "items.length": 1
            "items[0].subject": Filter contract BetaToken

      - id: filter_not_dash_prefix
        # "-" is the documented shorthand for NOT.
        action: request
        method: GET
        path: /v1/agents/bot@filter-contract.test.dev/messages?direction=outbound&filter=-label:contracttag
        expect:
          status: 200
          body_match:
            "items.length": 1
            "items[0].subject": Filter contract BetaToken

      - id: filter_and
        action: request
        method: GET
        path: /v1/agents/bot@filter-contract.test.dev/messages?direction=outbound&filter=subject:AlphaToken%20AND%20label:contracttag
        expect:
          status: 200
          body_match:
            "items.length": 1
            "items[0].subject": Filter contract AlphaToken

      - id: filter_and_no_match
        # BetaToken carries no label, so the AND is empty.
        action: request
        method: GET
        path: /v1/agents/bot@filter-contract.test.dev/messages?direction=outbound&filter=subject:BetaToken%20AND%20label:contracttag
        expect:
          status: 200
          body_match:
            "items.length": 0

      - id: filter_implicit_and
        # Whitespace between expressions is the documented implicit AND.
        action: request
        method: GET
        path: /v1/agents/bot@filter-contract.test.dev/messages?direction=outbound&filter=subject:AlphaToken%20label:contracttag
        expect:
          status: 200
          body_match:
            "items.length": 1
            "items[0].subject": Filter contract AlphaToken

      - id: filter_parens
        action: request
        method: GET
        path: /v1/agents/bot@filter-contract.test.dev/messages?direction=outbound&filter=%28subject:AlphaToken%20OR%20subject:BetaToken%29%20AND%20label:contracttag
        expect:
          status: 200
          body_match:
            "items.length": 1
            "items[0].subject": Filter contract AlphaToken

      - id: filter_precedence_or_before_implicit_and
        # Documented precedence is NOT > OR > implicit AND > explicit AND, so
        # this parses as (BetaToken OR AlphaToken) AND label:contracttag — only
        # AlphaToken carries the label. A naive AND-before-OR reading would
        # return both messages.
        action: request
        method: GET
        path: /v1/agents/bot@filter-contract.test.dev/messages?direction=outbound&filter=subject:BetaToken%20OR%20subject:AlphaToken%20label:contracttag
        expect:
          status: 200
          body_match:
            "items.length": 1
            "items[0].subject": Filter contract AlphaToken

      - id: filter_and_flat_composition
        # The flat labels filter ANDs with the expression: BetaToken matches
        # the expression but carries no label, so the composition is empty.
        action: request
        method: GET
        path: /v1/agents/bot@filter-contract.test.dev/messages?direction=outbound&labels=contracttag&filter=subject:BetaToken
        expect:
          status: 200
          body_match:
            "items.length": 0

      - id: filter_created_on_or_after
        action: request
        method: GET
        path: /v1/agents/bot@filter-contract.test.dev/messages?direction=outbound&filter=created%3E=2020-01-01
        expect:
          status: 200
          body_match:
            "items.length": 2

      - id: filter_created_before
        action: request
        method: GET
        path: /v1/agents/bot@filter-contract.test.dev/messages?direction=outbound&filter=created%3C2020-01-01
        expect:
          status: 200
          body_match:
            "items.length": 0

      - id: filter_unknown_field_rejected
        # has:attachment is deliberately not a v1 field.
        action: request
        method: GET
        path: /v1/agents/bot@filter-contract.test.dev/messages?direction=outbound&filter=has:attachment
        expect:
          status: 400
          body_match:
            "error.code": invalid_filter

      - id: filter_malformed_rejected
        # Unbalanced parenthesis (%28) must not parse.
        action: request
        method: GET
        path: /v1/agents/bot@filter-contract.test.dev/messages?direction=outbound&filter=%28subject:AlphaToken
        expect:
          status: 400
          body_match:
            "error.code": invalid_filter

      - id: filter_operator_rejected
        # label only supports ":" — "=" (%3D) is a validation error, not a
        # silent different meaning.
        action: request
        method: GET
        path: /v1/agents/bot@filter-contract.test.dev/messages?direction=outbound&filter=label%3Dcontracttag
        expect:
          status: 400
          body_match:
            "error.code": invalid_filter

      - id: filter_cursor_page1
        action: request
        method: GET
        path: /v1/agents/bot@filter-contract.test.dev/messages?direction=outbound&limit=1&filter=created%3E=2020-01-01
        expect:
          status: 200
          body_match:
            "items.length": 1
        capture:
          filter_cursor: next_cursor

      - id: filter_cursor_page2_same_filter
        action: request
        method: GET
        path: /v1/agents/bot@filter-contract.test.dev/messages?direction=outbound&limit=1&filter=created%3E=2020-01-01&cursor={filter_cursor}
        expect:
          status: 200
          body_match:
            "items.length": 1

      - id: filter_cursor_changed_filter_rejected
        action: request
        method: GET
        path: /v1/agents/bot@filter-contract.test.dev/messages?direction=outbound&limit=1&filter=subject:BetaToken&cursor={filter_cursor}
        expect:
          status: 400
          body_match:
            "error.code": invalid_cursor

      - id: filter_cursor_dropped_filter_rejected
        action: request
        method: GET
        path: /v1/agents/bot@filter-contract.test.dev/messages?direction=outbound&limit=1&cursor={filter_cursor}
        expect:
          status: 400
          body_match:
            "error.code": invalid_cursor

    cleanup:
      - id: delete_agent_permanently
        action: request
        method: DELETE
        path: /v1/agents/bot@filter-contract.test.dev?confirm=DELETE&permanent=true
        expect:
          status: 200
          body_match:
            deleted: true
            email: bot@filter-contract.test.dev

      - id: delete_domain
        action: request
        method: DELETE
        path: /v1/domains/filter-contract.test.dev?confirm=DELETE
        expect:
          status: 200
          body_match:
            deleted: true
            domain: filter-contract.test.dev

  - name: reply_quote_history
    description: >
      Beta quote_history on reply: when true, the server composes the
      referenced message beneath the caller's text as mail-client-style quoted
      history (an attribution line plus the '>'-prefixed original body) at
      accept time, so the stored outbound row already carries the final
      content; when the flag is absent the stored body stays byte-verbatim.
      The injected parent is Date-less and its raw body is the literal
      "body", so the composed attribution is fully deterministic. The detail
      view surfaces the quote-stripped parsed.text, so the assertions match
      that projection exactly; the raw wire composition is pinned by unit
      tests server-side. Both replies use a future send_at (composition
      happens at accept, before scheduling) so the scenario never submits to
      a provider — no real mail in seed mode, and trash-cancel in cleanup
      cannot race a submission lease (the same pattern as the scheduled_*
      scenarios).
    setup:
      - register_agent:
          email: quote-history-{scenario_token}@agents.e2a.dev
      - inject_message:
          agent_email: "{agent_email}"
          from: alice@example.net
          subject: quote history target
    steps:
      - id: quoted_reply
        action: request
        method: POST
        path: /v1/agents/{agent_email}/messages/{injected_message_id}/reply
        body:
          text: quoted reply conformance
          quote_history: true
          send_at: "{future_rfc3339}"
        expect:
          status: 202
          body_match:
            status: scheduled
        capture:
          quoted_message_id: message_id

      - id: get_quoted_reply
        action: request
        method: GET
        path: /v1/agents/{agent_email}/messages/{quoted_message_id}
        expect:
          status: 200
          body_match:
            id: "{quoted_message_id}"
            # The detail view exposes the model-facing parsed.text, which the
            # inbound-style parser QUOTE-STRIPS — the ">"-prefixed lines are
            # removed and the attribution line remains. Its presence is the
            # cross-surface proof the server composed the quote onto the wire
            # (raw_message carries the full "> body" block but embeds a Date
            # header, so it cannot be matched by equality). The exact wire
            # composition is pinned by unit tests in internal/httpapi and
            # internal/outbound.
            "parsed.text": "quoted reply conformance\n\nalice@example.net wrote:"

      - id: verbatim_reply
        action: request
        method: POST
        path: /v1/agents/{agent_email}/messages/{injected_message_id}/reply
        body:
          text: verbatim reply conformance
          send_at: "{future_rfc3339}"
        expect:
          status: 202
          body_match:
            status: scheduled
        capture:
          verbatim_message_id: message_id

      - id: get_verbatim_reply
        action: request
        method: GET
        path: /v1/agents/{agent_email}/messages/{verbatim_message_id}
        expect:
          status: 200
          body_match:
            id: "{verbatim_message_id}"
            "parsed.text": verbatim reply conformance

    cleanup:
      - id: trash_quoted_reply
        action: request
        method: DELETE
        path: /v1/agents/{agent_email}/messages/{quoted_message_id}
        expect:
          status: 200
          body_match:
            deleted: true

      - id: trash_verbatim_reply
        action: request
        method: DELETE
        path: /v1/agents/{agent_email}/messages/{verbatim_message_id}
        expect:
          status: 200
          body_match:
            deleted: true

      - id: delete_agent_permanently
        action: request
        method: DELETE
        path: /v1/agents/{agent_email}?confirm=DELETE&permanent=true
        expect:
          status: 200
          body_match:
            deleted: true

  - name: agent_metrics_counters
    description: >
      Per-agent counter metrics: an untouched agent reports null rates rather
      than zeros, and a held send moves the accepted/review counters while
      leaving the downstream stages it never reached at null.
    setup:
      - register_domain: metrics-contract.test.dev
      - verify_domain: metrics-contract.test.dev
      - register_agent:
          email: bot@metrics-contract.test.dev
    steps:
      # A brand-new agent has no traffic at all. Every rate must be null: a
      # zero here would be indistinguishable from total delivery failure, which
      # is the one reading a dashboard must never make by accident.
      - id: metrics_before_any_traffic
        action: request
        method: GET
        path: /v1/agents/bot@metrics-contract.test.dev/metrics
        expect:
          status: 200
          body_contains:
            - agent_email
            - start
            - end
            - messages_in_window
            - messages_with_lifecycle
            - reconstructed_observations
            - summary
            - rates
            - counters
          body_match:
            agent_email: bot@metrics-contract.test.dev
            messages_in_window: 0
            messages_with_lifecycle: 0
            "counters.length": 0
            "summary.accepted": 0
            "summary.delivered": 0
            "rates.delivered_rate": null
            "rates.bounce_rate": null
            "rates.complaint_rate": null
            "rates.suppression_block_rate": null

      - id: reject_window_wider_than_the_cap
        action: request
        method: GET
        path: /v1/agents/bot@metrics-contract.test.dev/metrics?start=2026-01-01T00:00:00Z&end=2026-07-01T00:00:00Z
        expect:
          status: 400
          body_match:
            "error.code": invalid_request

      - id: reject_inverted_window
        action: request
        method: GET
        path: /v1/agents/bot@metrics-contract.test.dev/metrics?start=2026-07-08T00:00:00Z&end=2026-07-01T00:00:00Z
        expect:
          status: 400
          body_match:
            "error.code": invalid_request

      # Route outbound mail to review so the send produces deterministic
      # lifecycle observations without depending on an upstream provider.
      - id: enable_outbound_review
        action: request
        method: PUT
        path: /v1/agents/bot@metrics-contract.test.dev/protection
        body:
          inbound:
            gate: {}
            scan: {}
          outbound:
            gate:
              policy: allowlist
              action: review
              allowlist: []
            scan: {}
          holds: {}
        expect:
          status: 200

      - id: send_held_for_review
        action: request
        method: POST
        path: /v1/agents/bot@metrics-contract.test.dev/messages
        body:
          to:
            - recipient@example.net
          subject: metrics contract
          text: held for review
        expect:
          status: 202
          body_match:
            status: pending_review

      # The held send is accepted and on hold, so those two counters move
      # together. Nothing was submitted, so bounce_rate stays null while
      # delivered_rate becomes a real 0 over a denominator of 1 — the pair that
      # proves null and zero are not being conflated.
      - id: metrics_after_held_send
        action: request
        method: GET
        path: /v1/agents/bot@metrics-contract.test.dev/metrics
        expect:
          status: 200
          body_match:
            messages_in_window: 1
            messages_with_lifecycle: 1
            "summary.accepted": 1
            "summary.review_held": 1
            "summary.submitted": 0
            "summary.delivered": 0
            "rates.delivered_rate": 0
            "rates.suppression_block_rate": 0
            "rates.bounce_rate": null
            "rates.complaint_rate": null
          body_array_contains:
            counters:
              reason_code: review.hold_created
              stage: review
              outcome: pending
              retryable: false
              observations: 1
              messages: 1

    cleanup:
      - id: delete_agent_permanently
        action: request
        method: DELETE
        path: /v1/agents/bot@metrics-contract.test.dev?confirm=DELETE&permanent=true
        expect:
          status: 200
          body_match:
            deleted: true
            email: bot@metrics-contract.test.dev

      - id: delete_domain
        action: request
        method: DELETE
        path: /v1/domains/metrics-contract.test.dev?confirm=DELETE
        expect:
          status: 200
          body_match:
            deleted: true
            domain: metrics-contract.test.dev

  - name: account_metrics_rollup
    description: >
      Account-wide counter metrics: the rollup answers with the same shape as
      the per-agent operation, and group_by=agent lists this scenario's agent in
      the breakdown. Assertions avoid absolute counts because the rollup spans
      every agent on the shared test account.
    setup:
      - register_domain: acctmetrics-contract.test.dev
      - verify_domain: acctmetrics-contract.test.dev
      - register_agent:
          email: bot@acctmetrics-contract.test.dev
    steps:
      # Give this agent exactly one message so it is guaranteed to appear in a
      # per-agent breakdown. Review keeps the send off any upstream provider.
      - id: enable_outbound_review
        action: request
        method: PUT
        path: /v1/agents/bot@acctmetrics-contract.test.dev/protection
        body:
          inbound:
            gate: {}
            scan: {}
          outbound:
            gate:
              policy: allowlist
              action: review
              allowlist: []
            scan: {}
          holds: {}
        expect:
          status: 200

      - id: send_held_for_review
        action: request
        method: POST
        path: /v1/agents/bot@acctmetrics-contract.test.dev/messages
        body:
          to:
            - recipient@example.net
          subject: account metrics contract
          text: held for review
        expect:
          status: 202
          body_match:
            status: pending_review

      - id: account_totals
        action: request
        method: GET
        path: /v1/metrics
        expect:
          status: 200
          body_contains:
            - start
            - end
            - messages_in_window
            - messages_with_lifecycle
            - reconstructed_observations
            - summary
            - rates
            - counters
            - agents
            - agents_truncated
            - webhooks
          body_match:
            agents_truncated: false
            # Webhook delivery is a separate fact source with its own grain and
            # a shorter retention; it must be present and zeroed for an account
            # with no subscribers, never absent.
            "webhooks.deliveries": 0
            "webhooks.endpoints_auto_disabled": 0
            "webhooks.success_rate": null
            "webhooks.endpoints.length": 0
          # The rollup is account-wide; it must never leak a per-agent identity
          # into the top level the way the per-agent operation does.
          body_excludes:
            - agent_email

      - id: account_breakdown_lists_this_agent
        action: request
        method: GET
        path: /v1/metrics?group_by=agent
        expect:
          status: 200
          body_match:
            agents_truncated: false
          body_array_contains:
            agents:
              agent_email: bot@acctmetrics-contract.test.dev

      - id: account_daily_buckets
        action: request
        method: GET
        path: /v1/metrics?bucket=day
        expect:
          status: 200
          body_contains:
            - buckets
          # Buckets are gap-filled across the default 30-day window, so the
          # count does not depend on how much traffic the account has. It is 31
          # because a 30-day window starting mid-day spans 31 UTC days; only a
          # request landing exactly on UTC midnight would see 30.
          body_match:
            "buckets.length": 31

      - id: buckets_absent_without_the_param
        action: request
        method: GET
        path: /v1/metrics
        expect:
          status: 200
          body_match:
            "buckets.length": 0

      - id: reject_unknown_bucket
        action: request
        method: GET
        path: /v1/metrics?bucket=hour
        expect:
          status: 422

      - id: reject_window_wider_than_the_cap
        action: request
        method: GET
        path: /v1/metrics?start=2026-01-01T00:00:00Z&end=2026-07-01T00:00:00Z
        expect:
          status: 400
          body_match:
            "error.code": invalid_request

      - id: reject_inverted_window
        action: request
        method: GET
        path: /v1/metrics?start=2026-07-08T00:00:00Z&end=2026-07-01T00:00:00Z
        expect:
          status: 400
          body_match:
            "error.code": invalid_request

    cleanup:
      - id: delete_agent_permanently
        action: request
        method: DELETE
        path: /v1/agents/bot@acctmetrics-contract.test.dev?confirm=DELETE&permanent=true
        expect:
          status: 200
          body_match:
            deleted: true
            email: bot@acctmetrics-contract.test.dev

      - id: delete_domain
        action: request
        method: DELETE
        path: /v1/domains/acctmetrics-contract.test.dev?confirm=DELETE
        expect:
          status: 200
          body_match:
            deleted: true
            domain: acctmetrics-contract.test.dev
