  - name: contacts_crud
    description: >
      Contact identity is account-level and keyed by the CANONICAL address.
      The create here deliberately sends an RFC 5322 mailbox — the shape a
      spreadsheet export produces — and every later step addresses the same
      contact by its bare form, so an SDK that forwards the raw input or
      mangles the encoded path fails here rather than in production.
    steps:
      - id: create
        action: request
        method: POST
        path: /v1/contacts
        body:
          address: "A. Partner <Partner@Fund.VC>"
          display_name: A. Partner
          metadata:
            fund: Example Capital
        expect:
          status: 201
          body_contains:
            - address
            - source
          body_match:
            address: partner@fund.vc
            display_name: A. Partner
            source: manual

      - id: duplicate_is_conflict
        action: request
        method: POST
        path: /v1/contacts
        body:
          address: partner@fund.vc
        expect:
          status: 409

      - id: get_by_bare_address
        action: request
        method: GET
        path: /v1/contacts/partner@fund.vc
        expect:
          status: 200
          body_match:
            address: partner@fund.vc
            display_name: A. Partner

      - id: patch_keeps_metadata
        action: request
        method: PATCH
        path: /v1/contacts/partner@fund.vc
        body:
          display_name: Renamed
        expect:
          status: 200
          body_match:
            display_name: Renamed
            "metadata.fund": Example Capital

      - id: list
        action: request
        method: GET
        path: /v1/contacts
        expect:
          status: 200
          body_contains:
            - items
            - next_cursor

      - id: delete_requires_confirm
        action: request
        method: DELETE
        path: /v1/contacts/partner@fund.vc
        expect:
          status: 422

      - id: delete
        action: request
        method: DELETE
        path: /v1/contacts/partner@fund.vc?confirm=DELETE
        expect:
          status: 200
          body_match:
            deleted: true

      - id: gone
        action: request
        method: GET
        path: /v1/contacts/partner@fund.vc
        expect:
          status: 404

  - name: contacts_import
    description: >
      Bulk import returns a per-row outcome so one bad line never rejects the
      upload. The batch mixes a valid row, an unparseable address, and a
      case-variant duplicate of the first — each must be reported against its
      own index, which is what lets a caller reconcile a spreadsheet line by
      line. The reversal then removes only what the batch created.
    steps:
      - id: import
        action: request
        method: POST
        path: /v1/contacts/import
        body:
          contacts:
            - address: "First <First@Imp.VC>"
              display_name: First
            - address: not-an-email
            - address: FIRST@imp.vc
            - address: "Second <Second@Imp.VC>"
              display_name: Second
        capture:
          batch_id: batch_id
        expect:
          status: 200
          body_contains:
            - batch_id
            - results
          body_match:
            created: 2
            failed: 1
            skipped: 1
            "results[0].status": created
            "results[0].address": first@imp.vc
            "results[1].status": failed
            "results[2].status": skipped
            "results[2].code": duplicate_in_batch
            "results[3].status": created
            "results[3].address": second@imp.vc

      - id: imported_contact_is_readable
        action: request
        method: GET
        path: /v1/contacts/first@imp.vc
        expect:
          status: 200
          body_match:
            source: import

      - id: filter_by_source
        action: request
        method: GET
        path: /v1/contacts?source=import
        expect:
          status: 200
          body_array_contains:
            items:
              address: first@imp.vc

      - id: empty_batch_rejected
        action: request
        method: POST
        path: /v1/contacts/import
        body:
          contacts: []
        expect:
          status: 422

      - id: null_contacts_rejected
        action: request
        method: POST
        path: /v1/contacts/import
        body:
          contacts: null
        expect:
          status: 422

      - id: missing_contacts_rejected
        action: request
        method: POST
        path: /v1/contacts/import
        body: {}
        expect:
          status: 422

      # A contact edited after the import no longer belongs solely to the
      # batch: reversal must remove the untouched row and keep the edited one,
      # and the receipt's deleted + retained must account for both.
      - id: edit_protects_from_reversal
        action: request
        method: PATCH
        path: /v1/contacts/second@imp.vc
        body:
          display_name: Second, Edited
        expect:
          status: 200

      - id: reverse_batch
        action: request
        method: DELETE
        path: /v1/contacts/imports/{batch_id}?confirm=DELETE
        expect:
          status: 200
          body_match:
            deleted: true
            contacts_deleted: 1
            contacts_retained: 1

      - id: untouched_contact_reversed
        action: request
        method: GET
        path: /v1/contacts/first@imp.vc
        expect:
          status: 404

      - id: edited_contact_survives
        action: request
        method: GET
        path: /v1/contacts/second@imp.vc
        expect:
          status: 200
          body_match:
            display_name: Second, Edited

    cleanup:
      # Best-effort (no expect): after a passing run the reversal already
      # removed first@imp.vc (404 here); after a mid-scenario failure this is
      # what keeps the scenario self-cleaning for the next run.
      - id: delete_first_contact_if_reversed
        action: request
        method: DELETE
        path: /v1/contacts/first@imp.vc?confirm=DELETE
      - action: request
        method: DELETE
        path: /v1/contacts/second@imp.vc?confirm=DELETE
        expect:
          status: 200

  - name: contacts_import_row_length_isolation
    description: >
      Per-row isolation for content-LENGTH violations. The 320-code-point
      bounds on address and display_name used to be item-level maxLength in
      the request schema, where one over-long spreadsheet cell rejected the
      whole upload with 422 and nothing imported. They are now per-row
      handler checks like every other content rule: the batch answers 200,
      the offending row alone reports failed with invalid_request, and its
      valid neighbours import. The over-long display_name row sits BETWEEN
      two valid rows — exactly the shape the schema bound used to reject
      wholesale. The reversal then removes what the batch created.
    steps:
      - id: import_with_overlong_row
        action: request
        method: POST
        path: /v1/contacts/import
        body:
          contacts:
            - address: iso-one@imp.vc
              display_name: Iso One
            - address: iso-long@imp.vc
              # 336 code points — over the 320 bound this row alone must fail on.
              display_name: "Much-Too-Long-Much-Too-Long-Much-Too-Long-Much-Too-Long-Much-Too-Long-Much-Too-Long-Much-Too-Long-Much-Too-Long-Much-Too-Long-Much-Too-Long-Much-Too-Long-Much-Too-Long-Much-Too-Long-Much-Too-Long-Much-Too-Long-Much-Too-Long-Much-Too-Long-Much-Too-Long-Much-Too-Long-Much-Too-Long-Much-Too-Long-Much-Too-Long-Much-Too-Long-Much-Too-Long-"
            - address: iso-two@imp.vc
              display_name: Iso Two
        capture:
          batch_id: batch_id
        expect:
          status: 200
          body_contains:
            - batch_id
            - results
          body_match:
            created: 2
            failed: 1
            skipped: 0
            "results[0].status": created
            "results[0].address": iso-one@imp.vc
            "results[1].status": failed
            "results[1].code": invalid_request
            "results[1].address": iso-long@imp.vc
            "results[2].status": created
            "results[2].address": iso-two@imp.vc

      - id: first_neighbour_imported
        action: request
        method: GET
        path: /v1/contacts/iso-one@imp.vc
        expect:
          status: 200
          body_match:
            display_name: Iso One
            source: import

      - id: failed_row_left_no_contact
        action: request
        method: GET
        path: /v1/contacts/iso-long@imp.vc
        expect:
          status: 404

      - id: second_neighbour_imported
        action: request
        method: GET
        path: /v1/contacts/iso-two@imp.vc
        expect:
          status: 200
          body_match:
            display_name: Iso Two

      - id: reverse_batch
        action: request
        method: DELETE
        path: /v1/contacts/imports/{batch_id}?confirm=DELETE
        expect:
          status: 200
          body_match:
            deleted: true
            contacts_deleted: 2
            contacts_retained: 0

    cleanup:
      # Best-effort (no expect): after a passing run the reversal already
      # removed both rows (404 here); after a mid-scenario failure these are
      # what keep the scenario self-cleaning for the next run.
      - action: request
        method: DELETE
        path: /v1/contacts/iso-one@imp.vc?confirm=DELETE
      - action: request
        method: DELETE
        path: /v1/contacts/iso-two@imp.vc?confirm=DELETE

  - name: contact_outreach
    description: >
      Per-agent outreach state. Enrolment creates the contact if absent, a
      partial update leaves the other agent-owned field alone (advancing a
      stage must not clear the schedule), derived fields are server-owned and
      rejected on write, and un-enrolling removes the outreach record while
      the account-level contact survives.
    setup:
      - register_domain: outreach.test.dev
      - verify_domain: outreach.test.dev
      - register_agent:
          email: raise@outreach.test.dev
    steps:
      - id: enrol
        action: request
        method: PUT
        path: /v1/agents/raise@outreach.test.dev/contacts/investor@fund.vc
        body:
          stage: touch1
          next_action_at: "2026-08-01T09:00:00Z"
        expect:
          status: 201
          body_contains:
            - stage
            - replied
            - suppressed
            - contact
          body_match:
            address: investor@fund.vc
            stage: touch1
            replied: false

      - id: stage_only_update_keeps_schedule
        action: request
        method: PUT
        path: /v1/agents/raise@outreach.test.dev/contacts/investor@fund.vc
        body:
          stage: touch2
        expect:
          status: 200
          body_contains:
            - next_action_at
          body_match:
            stage: touch2

      - id: derived_fields_are_server_owned
        action: request
        method: PUT
        path: /v1/agents/raise@outreach.test.dev/contacts/investor@fund.vc
        body:
          replied: true
        expect:
          status: 422

      - id: outreach_query
        action: request
        method: GET
        path: /v1/agents/raise@outreach.test.dev/contacts?replied=false
        expect:
          status: 200
          body_match:
            "items[0].address": investor@fund.vc
            "items[0].stage": touch2

      - id: unenrol
        action: request
        method: DELETE
        path: /v1/agents/raise@outreach.test.dev/contacts/investor@fund.vc?confirm=DELETE
        expect:
          status: 200
          body_match:
            deleted: true

      - id: contact_survives_unenrolment
        action: request
        method: GET
        path: /v1/contacts/investor@fund.vc
        expect:
          status: 200

    cleanup:
      - action: request
        method: DELETE
        path: /v1/contacts/investor@fund.vc?confirm=DELETE
        expect:
          status: 200

  - name: cursor_binding_foreign_cursor_rejected
    description: >
      Pagination cursors are bound to the exact query that minted them — the
      collection, its parent path parameters, its filters, and the minting
      account. Replaying a genuinely minted cursor anywhere else must surface
      400 invalid_cursor, never a silently mispositioned (typically empty)
      200 page. The runners share a single test account, so the cross-account
      replay cannot be staged in this DSL; that axis binds via the MAC key
      and is deliberately indistinguishable from the forged-cursor case
      asserted last here — its two-account matrix lives in
      internal/httpapi/cursor_binding_test.go.
    steps:
      # Two contacts so a limit=1 first page yields a real continuation cursor.
      - id: seed_first
        action: request
        method: POST
        path: /v1/contacts
        body:
          address: cursor-a@bind.vc
        expect:
          status: 201

      - id: seed_second
        action: request
        method: POST
        path: /v1/contacts
        body:
          address: cursor-b@bind.vc
        expect:
          status: 201

      - id: mint
        action: request
        method: GET
        path: /v1/contacts?limit=1
        expect:
          status: 200
          body_match:
            "items.length": 1
        capture:
          contacts_cursor: next_cursor

      - id: foreign_endpoint_rejected
        # A real /v1/contacts cursor presented to /v1/agents: pre-binding this
        # verified (same HMAC secret, same keyset shape) and anchored the
        # agents query at a meaningless position; now it is a 400.
        action: request
        method: GET
        path: /v1/agents?cursor={contacts_cursor}
        expect:
          status: 400
          body_match:
            "error.code": invalid_cursor

      - id: own_continuation_still_walks
        action: request
        method: GET
        path: /v1/contacts?limit=1&cursor={contacts_cursor}
        expect:
          status: 200
          body_match:
            "items.length": 1

      - id: forged_cursor_rejected
        # The same surface a foreign ACCOUNT's cursor produces: a plain MAC
        # failure, indistinguishable from tampering.
        action: request
        method: GET
        path: /v1/contacts?cursor=not-a-real-cursor
        expect:
          status: 400
          body_match:
            "error.code": invalid_cursor

    cleanup:
      - action: request
        method: DELETE
        path: /v1/contacts/cursor-a@bind.vc?confirm=DELETE
        expect:
          status: 200
      - action: request
        method: DELETE
        path: /v1/contacts/cursor-b@bind.vc?confirm=DELETE
        expect:
          status: 200

  - name: invalid_utf8_rejected
    description: >
      Well-formed-text rule: no client-supplied string may carry an invalid
      UTF-8 byte sequence, whichever seam it arrives through — raw request
      body, path param, query param or header. Every arm answers 400
      invalid_request located at the offending field: never a 5xx, and never a
      silent U+FFFD substitution (JSON decoders launder invalid bytes into the
      replacement character before any field-level check can see them, which
      is why the body arm is enforced on the RAW bytes before decoding).

      The body and header arms cannot be written as YAML scalars: YAML is
      UTF-8 by definition and its \xFF escape denotes codepoint U+00FF, which
      encodes to the perfectly VALID two-byte sequence C3 BF. They therefore
      use raw_body_base64 / headers_base64, which every runner decodes to
      bytes and transmits verbatim. The path and query arms need no escape
      hatch — %FF is pure ASCII on the wire.

      Self-cleaning by construction: every request is a rejection, so nothing
      is ever created and there is nothing to delete. The two probe steps
      assert exactly that, including for the LAUNDERED address (a + U+FFFD +
      b) that the pre-fix server persisted with a 201.
    steps:
      - id: path_param_rotate_secret_rejected
        # Was a 500 "failed to rotate webhook secret": the raw byte reached
        # the store's UPDATE and Postgres refused it (SQLSTATE 22021).
        action: request
        method: POST
        path: /v1/webhooks/%FF/rotate-secret
        expect:
          status: 400
          body_match:
            "error.code": invalid_request
            "error.details.fields[0].location": path.id
            "error.details.fields[0].message": must be valid UTF-8

      - id: path_param_get_webhook_rejected
        # The read path masked the same defect as a 404; the blanket rule
        # makes it the same actionable 400.
        action: request
        method: GET
        path: /v1/webhooks/%FF
        expect:
          status: 400
          body_match:
            "error.code": invalid_request
            "error.details.fields[0].location": path.id
            "error.details.fields[0].message": must be valid UTF-8

      - id: query_param_rejected
        action: request
        method: GET
        path: /v1/contacts?import_batch_id=%FF
        expect:
          status: 400
          body_match:
            "error.code": invalid_request
            "error.details.fields[0].location": query.import_batch_id
            "error.details.fields[0].message": must be valid UTF-8

      - id: body_rejected
        # Decodes to {"address":"a\xFFb@example.com","display_name":"invalid
        # utf8 body"} with a raw 0xFF byte inside the address. Pre-fix this
        # answered 201 and stored the address with U+FFFD in place of the
        # byte — the corruption nothing downstream can ever see.
        action: request
        method: POST
        path: /v1/contacts
        raw_body_base64: eyJhZGRyZXNzIjoiYf9iQGV4YW1wbGUuY29tIiwiZGlzcGxheV9uYW1lIjoiaW52YWxpZCB1dGY4IGJvZHkifQ==
        expect:
          status: 400
          body_match:
            "error.code": invalid_request
            "error.details.fields[0].location": body
            "error.details.fields[0].message": request body must be valid UTF-8
          # The envelope must not echo the offending bytes back.
          body_excludes:
            - address

      - id: laundered_body_address_was_not_created
        # a + U+FFFD + b @example.com, percent-encoded. This is the address
        # the pre-fix 201 actually persisted, so a 404 here is the proof that
        # the rejection left no row.
        action: request
        method: GET
        path: /v1/contacts/a%EF%BF%BDb@example.com
        expect:
          status: 404
          body_match:
            "error.code": contact_not_found

      - id: header_rejected
        # Idempotency-Key: k\xFFz (base64 "a/96"). Pre-fix the raw byte
        # reached the idempotency store and came back as a 500 "idempotency
        # store error". The BODY here is deliberately valid, so the header is
        # the only thing that can be rejected.
        action: request
        method: POST
        path: /v1/contacts
        body:
          address: hdr-utf8-{scenario_token}@example.com
        headers_base64:
          Idempotency-Key: a/96
        expect:
          status: 400
          body_match:
            "error.code": invalid_request
            "error.details.fields[0].location": header.Idempotency-Key
            "error.details.fields[0].message": must be valid UTF-8

      - id: header_rejected_contact_was_not_created
        action: request
        method: GET
        path: /v1/contacts/hdr-utf8-{scenario_token}@example.com
        expect:
          status: 404
          body_match:
            "error.code": contact_not_found
