# Shared behavioral contract scenarios for the /v1 public API.
#
# The typed Huma /v1 surface (internal/httpapi) is the source of truth. The
# legacy gorilla/mux /api/v1 surface has been fully retired (Slice 8e), so every
# scenario here exercises /v1. The HITL magic-link pages moved to /v1/approve
# and /v1/reject (raw HTML, served via the chi root's fallback to the mux).
#
# Each scenario is a sequence of steps executed against a live test server.
# The Go runner (contract_test.go) and the TypeScript and Python SDK contract
# runners consume this file directly, so the format must remain
# language-agnostic.
#
# Setup helpers:
#   register_domain — claim a domain directly in the store
#   verify_domain   — mark a claimed domain verified in the store
#   register_agent  — create an agent through the public API
#   inject_message  — insert an inbound message directly in the store
#
# Step actions:
#   request          — make an HTTP request, assert status and optional body fields
#   inject_message   — insert an inbound message directly in the store
#   ws_connect       — open a WebSocket connection
#   ws_reconnect     — reconnect a WebSocket connection to trigger drain-on-reconnect
#   ws_read          — read and assert one WebSocket notification
#   verify_and_retry — verify a domain in the store, then replay an HTTP request
#
# Raw-bytes escape hatches (request steps only). YAML is UTF-8 by definition
# and its \xNN escape denotes a CODEPOINT, so a scenario cannot express a
# request whose bytes are not well-formed UTF-8 using `body:` or an ordinary
# header value. These two keys carry base64 instead, and every runner decodes
# them and puts the bytes on the wire VERBATIM — no JSON encoder, no charset
# transcoding, no placeholder substitution:
#   raw_body_base64  — request body bytes, sent as application/json.
#                      Mutually exclusive with `body:`.
#   headers_base64   — {Header-Name: base64} request header values.
#                      Combinable with `body:` or `raw_body_base64`.
# Use them only when the bytes genuinely cannot be written as text; every
# other scenario stays readable with `body:`.
#
# Optional cleanup blocks contain request steps. Every runner executes them in
# declaration order after setup/steps, including after failures. Cleanup is
# best-effort: every request runs, the primary failure wins, and otherwise a
# cleanup failure fails the scenario.
#
# Placeholder tokens (resolved by runner at execution time):
#   {base_url}      — test server URL
#   {api_key}       — valid API key for the test user
#   {agent_email}   — agent email created by a prior register_agent setup step
#   {injected_message_id} — message ID created by a prior inject_message step

scenarios:

  - name: agent_crud
    description: Register, list, get (verify no leaked fields), delete agent
    setup:
      - register_domain: crud.test.dev
      - verify_domain: crud.test.dev
    steps:
      - id: register
        action: request
        method: POST
        path: /v1/agents
        body:
          email: bot@crud.test.dev
        expect:
          status: 201
          # AgentView dropped the redundant `id` (an agent's id IS its email),
          # so `email` is the sole identity key asserted here.
          body_contains:
            - email
          body_match:
            email: bot@crud.test.dev

      - id: list
        action: request
        method: GET
        path: /v1/agents
        expect:
          status: 200
          body_contains:
            - items
          body_match:
            "items[0].email": bot@crud.test.dev

      - id: get
        action: request
        method: GET
        path: /v1/agents/bot@crud.test.dev
        expect:
          status: 200
          # AgentView dropped `id` — email is the identity key.
          body_contains:
            - email
          body_excludes:
            - id
            - user_id
            - public
            - agent_mode
            - webhook_url

      - id: delete
        action: request
        method: DELETE
        path: /v1/agents/bot@crud.test.dev?confirm=DELETE
        # /v1 deleteAgent requires ?confirm=DELETE (AG-6); returns 200 with the
        # uniform deletion receipt {deleted:true, email, messages_deleted}.
        expect:
          status: 200
          body_match:
            deleted: true
            email: bot@crud.test.dev

      - id: list_after_delete
        action: request
        method: GET
        path: /v1/agents
        expect:
          status: 200
          body_match:
            "items.length": 0

  - name: domain_crud
    description: Register, list, verify, delete domain with typed responses
    steps:
      - id: register
        action: request
        method: POST
        path: /v1/domains
        body:
          domain: domain-crud.test.dev
        expect:
          status: 201
          body_contains:
            - domain
            - verified
            - capabilities
            - verification_token
            - dns_records
          body_match:
            domain: domain-crud.test.dev
            verified: false
            # capabilities is the per-axis rollup. inbound restates `verified`;
            # outbound restates the sending_status rollup, which is `none` here
            # because the contract server runs with the sending feature off
            # (no ses_region) — the same reason no mail_from records appear below.
            "capabilities.inbound": "pending"
            "capabilities.outbound": "none"
            # dns_records is now ONE purpose-tagged array (was an mx/txt/dkim
            # object). [0]=ownership, [1]=inbound_mx are always first; status
            # follows `verified` for inbound records (pending until verified).
            "dns_records[0].purpose": "ownership"
            "dns_records[0].type": "TXT"
            "dns_records[0].status": "pending"
            "dns_records[1].purpose": "inbound_mx"
            "dns_records[1].type": "MX"
            "dns_records[1].priority": 10

      - id: list
        action: request
        method: GET
        path: /v1/domains
        expect:
          status: 200
          body_match:
            "items.length": 1

      - id: verify
        action: request
        method: POST
        path: /v1/domains/domain-crud.test.dev/verify
        # In the dev/test harness (Production=false) the DNS probe short-
        # circuits TXTFound=true, so /v1 marks the domain verified and
        # returns 200 + verified=true.
        expect:
          status: 200
          body_match:
            verified: true

      # The axes move independently: verifying inbound flips capabilities.inbound
      # to verified while outbound stays where it was. VerifyDomainView has no
      # capabilities field (it speaks the live-probe vocabulary), so this pins the
      # post-verify state through GET, which is the documented poll target.
      - id: get_after_verify
        action: request
        method: GET
        path: /v1/domains/domain-crud.test.dev
        expect:
          status: 200
          body_contains:
            - capabilities
          body_match:
            verified: true
            "capabilities.inbound": "verified"
            "capabilities.outbound": "none"

      - id: delete
        action: request
        method: DELETE
        path: /v1/domains/domain-crud.test.dev?confirm=DELETE
        # /v1 deleteDomain requires ?confirm=DELETE (D-5); returns 200 with the
        # uniform deletion object {deleted:true, domain}.
        expect:
          status: 200
          body_match:
            deleted: true
            domain: domain-crud.test.dev

  - name: read_state_transition
    description: GET /messages/{id} marks unread messages as read
    setup:
      - register_domain: readstate.test.dev
      - verify_domain: readstate.test.dev
      - register_agent:
          email: bot@readstate.test.dev
      - inject_message:
          agent_email: "{agent_email}"
          from: alice@example.com
          subject: Test read state
    steps:
      - id: list_unread
        action: request
        method: GET
        path: /v1/agents/{agent_email}/messages?read_status=unread
        # /v1 listMessages returns the standardized cursor page
        # {"items":[...],"next_cursor":...} (not the legacy {"messages":[...]}).
        expect:
          status: 200
          body_match:
            "items.length": 1
            "items[0].read_status": unread
        capture:
          read_thread_id: "items[0].thread_id"

      - id: get_detail
        action: request
        method: GET
        path: /v1/agents/{agent_email}/messages/{injected_message_id}
        expect:
          status: 200
          body_match:
            header_from: alice@example.com
            envelope_from: alice@example.com
            verified_domain: example.com
            authentication.spf.status: pass
            authentication.spf.domain: example.com
            authentication.spf.aligned: true
            authentication.dkim.length: 0
            authentication.dmarc.status: pass
            authentication.dmarc.domain: example.com
            authentication.dmarc.policy: reject
            "authentication.dmarc.aligned_by[0]": spf
            thread_id: "{read_thread_id}"

      - id: list_unread_after
        action: request
        method: GET
        path: /v1/agents/{agent_email}/messages?read_status=unread
        expect:
          status: 200
          body_match:
            "items.length": 0

      - id: list_read
        action: request
        method: GET
        path: /v1/agents/{agent_email}/messages?read_status=read
        expect:
          status: 200
          body_match:
            "items.length": 1
            "items[0].read_status": read

  - name: placeholder_resolution
    description: Placeholders resolve in request bodies and expected values
    setup:
      - register_domain: placeholder.test.dev
      - verify_domain: placeholder.test.dev
      - register_agent:
          email: bot@placeholder.test.dev
    steps:
      - id: duplicate_register_with_placeholder
        action: request
        method: POST
        path: /v1/agents
        body:
          email: "{agent_email}"
        expect:
          status: 409

      - id: list_agents_matches_placeholder
        action: request
        method: GET
        path: /v1/agents
        expect:
          status: 200
          body_match:
            "items[0].email": "{agent_email}"

  - name: auth_rejection
    description: Missing or invalid API keys get 401 across all endpoints
    auth_override: none
    steps:
      - id: no_auth_list_agents
        action: request
        method: GET
        path: /v1/agents
        # /v1 errors use the envelope {"error":{"code","message","request_id"}};
        # an unauthenticated call carries code=unauthorized.
        expect:
          status: 401
          body_match:
            "error.code": unauthorized

      - id: no_auth_create_agent
        action: request
        method: POST
        path: /v1/agents
        # Body is schema-valid so the request reaches the auth check (the
        # handler authenticates via requirePrincipal); this isolates the
        # auth dimension rather than tripping body validation (422) first.
        body:
          email: auth-probe@example.com
        expect:
          status: 401
          body_match:
            "error.code": unauthorized

      - id: no_auth_list_domains
        action: request
        method: GET
        path: /v1/domains
        expect:
          status: 401
          body_match:
            "error.code": unauthorized

      - id: no_auth_send
        action: request
        method: POST
        path: /v1/agents/bot@example.com/messages
        body:
          to: ["someone@example.com"]
          subject: probe
          text: probe
        expect:
          status: 401
          body_match:
            "error.code": unauthorized

  - name: auth_rejection_invalid_key
    description: Invalid API key gets 401 across all endpoints
    auth_override: "Bearer e2a_invalid_key_12345"
    steps:
      - id: invalid_key_list_agents
        action: request
        method: GET
        path: /v1/agents
        expect:
          status: 401
          body_match:
            "error.code": unauthorized

      - id: invalid_key_create_agent
        action: request
        method: POST
        path: /v1/agents
        body:
          email: auth-probe@example.com
        expect:
          status: 401
          body_match:
            "error.code": unauthorized

      - id: invalid_key_list_domains
        action: request
        method: GET
        path: /v1/domains
        expect:
          status: 401
          body_match:
            "error.code": unauthorized

      - id: invalid_key_send
        action: request
        method: POST
        path: /v1/agents/bot@example.com/messages
        body:
          to: ["someone@example.com"]
          subject: probe
          text: probe
        expect:
          status: 401
          body_match:
            "error.code": unauthorized

  - name: domain_verification_enforced
    description: Agent registration blocked on unverified domain
    setup:
      - register_domain: unverified.test.dev
    steps:
      - id: register_on_unverified
        action: request
        method: POST
        path: /v1/agents
        body:
          email: bot@unverified.test.dev
        # /v1 createAgent rejects an unverified (but claimed) domain with a
        # 400 envelope carrying code=domain_not_verified.
        expect:
          status: 400
          body_match:
            "error.code": domain_not_verified

      - id: verify_then_register
        action: verify_and_retry
        verify_domain: unverified.test.dev
        method: POST
        path: /v1/agents
        body:
          email: bot@unverified.test.dev
        expect:
          status: 201

  - name: ws_notification_shape
    description: >
      WebSocket drain-on-reconnect delivers frames in the versioned event
      envelope — {type, id, schema_version, created_at, data} — carrying the
      email.received data payload (the same shape as a webhook delivery).
      Notification-only protocol: server sends events, client never sends
      application frames.
    setup:
      - register_domain: ws.test.dev
      - verify_domain: ws.test.dev
      - register_agent:
          email: bot@ws.test.dev
    steps:
      - id: connect
        action: ws_connect
        path: /v1/agents/{agent_email}/ws

      - id: inject
        action: inject_message
        agent_email: "{agent_email}"
        from: alice@example.com
        subject: WS test

      - id: reconnect
        action: ws_reconnect
        path: /v1/agents/{agent_email}/ws

      - id: read_notification
        action: ws_read
        expect:
          fields_present:
            - type
            - id
            - schema_version
            - created_at
            - data.message_id
            - data.header_from
            - data.envelope_from
            - data.authentication
            - data.delivered_to
            - data.agent_email
            - data.direction
            - data.subject
            - data.received_at
          fields_absent:
            - data.body
            - data.raw_message
            - data.thread_id
            - data.from
            - data.authenticated_from
            - data.auth
            - data.auth_headers
          field_match:
            type: email.received
            schema_version: "1"
            data.header_from: alice@example.com
            data.envelope_from: alice@example.com
            data.delivered_to: "{agent_email}"
            data.agent_email: "{agent_email}"
            data.direction: inbound
            data.subject: WS test

  - name: health_check
    description: Health endpoint is available without auth
    steps:
      - id: health
        action: request
        method: GET
        path: /api/health
        auth_override: none
        expect:
          status: 200

  - name: hitl_send_holds_202
    description: >
      With an outbound review policy on the agent (outbound_policy=allowlist +
      outbound_policy_action=review, empty allowlist → every recipient unknown),
      POST /send returns 202 + status=pending_review + approval_expires_at.
      (hitl_enabled was retired — holds now come from the screening policy.)
    setup:
      - register_domain: hitl-hold.test.dev
      - verify_domain: hitl-hold.test.dev
      - register_agent:
          email: bot@hitl-hold.test.dev
    steps:
      - id: enable_outbound_review
        # Screening config lives on the account-scoped /protection sub-resource
        # (PUT, full replace). An empty-allowlist outbound review gate holds every send.
        action: request
        method: PUT
        path: /v1/agents/{agent_email}/protection
        body:
          inbound:
            gate: {}
            scan: {}
          outbound:
            gate:
              policy: allowlist
              action: review
              allowlist: []
            scan: {}
          holds: {}
        expect:
          status: 200
          body_match:
            outbound.gate.action: review

      - id: send_held
        action: request
        method: POST
        path: /v1/agents/{agent_email}/messages
        body:
          to:
            - alice@example.com
          subject: Hold me
          text: please review before sending
        expect:
          status: 202
          body_contains:
            - status
            - message_id
            - approval_expires_at
          body_excludes:
            - thread_id
          body_match:
            status: pending_review

  - name: hitl_reject_records_reason
    description: >
      Reject endpoint accepts a reason in the body and surfaces it. Catches the
      chunked-body regression (rejection reason was silently dropped when
      ContentLength was unknown). Uses the outbound review policy to hold the send
      (hitl_enabled retired); reject yields the unified status=review_rejected.
    setup:
      - register_domain: hitl-reject.test.dev
      - verify_domain: hitl-reject.test.dev
      - register_agent:
          email: bot@hitl-reject.test.dev
    steps:
      - id: enable_outbound_review
        action: request
        method: PUT
        path: /v1/agents/{agent_email}/protection
        body:
          inbound:
            gate: {}
            scan: {}
          outbound:
            gate:
              policy: allowlist
              action: review
              allowlist: []
            scan: {}
          holds: {}
        expect:
          status: 200

      - id: send_held
        action: request
        method: POST
        path: /v1/agents/{agent_email}/messages
        body:
          to:
            - alice@example.com
          subject: To be rejected
          text: this should never go out
        expect:
          status: 202
          body_contains:
            - message_id
        capture:
          held_id: message_id

      - id: get_held_review
        action: request
        method: GET
        path: /v1/reviews/{held_id}
        expect:
          status: 200
          body_excludes:
            - thread_id

      - id: reject
        # Reject is the account-scoped review-queue operation
        # (POST /v1/reviews/{id}/reject) — a review's id IS the held message's
        # id, so no inbox email is needed. RejectResultView surfaces
        # {status, message_id, rejection_reason}. Status is the unified
        # review_rejected (was the outbound-only 'rejected'). The deprecated
        # agent-path reject route was removed in the pre-GA vocabulary freeze.
        action: request
        method: POST
        path: /v1/reviews/{held_id}/reject
        body:
          reason: off-topic for this audience
        expect:
          status: 200
          body_match:
            status: review_rejected
            rejection_reason: off-topic for this audience

  - name: messages_direction_all_shape
    description: >
      GET /agents/{email}/messages?direction=all returns the dashboard-
      inbox shape: every row carries `direction`, outbound rows carry
      `review_status` and `webhook_status`. Catches the H1 SDK contract
      drift if httpapi.MessageSummaryView falls out of sync with the
      handler again.
    setup:
      - register_domain: mixed.test.dev
      - verify_domain: mixed.test.dev
      - register_agent:
          email: bot@mixed.test.dev
      - inject_message:
          agent_email: "{agent_email}"
          from: external@example.com
          subject: an inbound row
    steps:
      - id: enable_outbound_review
        action: request
        method: PUT
        path: /v1/agents/{agent_email}/protection
        body:
          inbound:
            gate: {}
            scan: {}
          outbound:
            gate:
              policy: allowlist
              action: review
              allowlist: []
            scan: {}
          holds: {}
        expect:
          status: 200

      - id: outbound_held
        action: request
        method: POST
        path: /v1/agents/{agent_email}/messages
        body:
          to:
            - someone@example.com
          subject: an outbound row
          text: pending
        expect:
          status: 202

      - id: list_mixed
        # /v1 listMessages: cursor page envelope ({"items":[...]}), page-size
        # param is `limit` (not legacy `page_size`). MessageSummaryView keeps
        # the per-row `direction`; outbound rows carry `review_status`.
        action: request
        method: GET
        path: /v1/agents/{agent_email}/messages?direction=all&limit=10
        expect:
          status: 200
          body_contains:
            - items
          # Two rows — the order is most-recent-first so the outbound
          # held row lands at index 0.
          body_match:
            "items.length": 2
            "items[0].direction": outbound
            "items[0].review_status": pending_review
            "items[1].direction": inbound

  - name: agent_suppression_and_managed_unsubscribe
    description: >
      The beta agent-suppression CRUD surface blocks the exact recipient until
      deletion, and managed unsubscribe is accepted by the live send endpoint.
      All setup is performed through public requests so every SDK contract
      runner executes this scenario rather than skipping store-backed setup.
    steps:
      - id: register_domain
        action: request
        method: POST
        path: /v1/domains
        body:
          domain: suppression-contract.test.dev
        expect:
          status: 201

      - id: verify_domain
        action: request
        method: POST
        path: /v1/domains/suppression-contract.test.dev/verify
        expect:
          status: 200
          body_match:
            verified: true

      - id: register_agent
        action: request
        method: POST
        path: /v1/agents
        body:
          email: bot@suppression-contract.test.dev
        expect:
          status: 201
          body_match:
            email: bot@suppression-contract.test.dev

      - id: create_suppression
        action: request
        method: POST
        path: /v1/agents/bot@suppression-contract.test.dev/suppressions
        body:
          address: recipient@example.net
          reason: contract test
        expect:
          status: 200
          body_match:
            agent_email: bot@suppression-contract.test.dev
            address: recipient@example.net
            source: manual

      - id: list_suppressions
        action: request
        method: GET
        path: /v1/agents/bot@suppression-contract.test.dev/suppressions
        expect:
          status: 200
          body_match:
            "items.length": 1
            "items[0].address": recipient@example.net

      - id: suppressed_send_refused
        action: request
        method: POST
        path: /v1/agents/bot@suppression-contract.test.dev/messages
        body:
          to:
            - Recipient <recipient@example.net>
          subject: blocked by agent suppression
          text: must not be accepted
        expect:
          status: 422
          body_match:
            "error.code": recipient_suppressed

      - id: delete_suppression
        action: request
        method: DELETE
        path: /v1/agents/bot@suppression-contract.test.dev/suppressions/recipient@example.net?confirm=DELETE
        expect:
          status: 200
          body_match:
            deleted: true
            address: recipient@example.net

      - id: enable_outbound_review
        action: request
        method: PUT
        path: /v1/agents/bot@suppression-contract.test.dev/protection
        body:
          inbound:
            gate: {}
            scan: {}
          outbound:
            gate:
              policy: allowlist
              action: review
              allowlist: []
            scan: {}
          holds: {}
        expect:
          status: 200

      - id: managed_unsubscribe_send_held
        action: request
        method: POST
        path: /v1/agents/bot@suppression-contract.test.dev/messages
        body:
          to:
            - recipient@example.net
          subject: managed unsubscribe contract
          text: held for review
          unsubscribe:
            mode: managed
        expect:
          status: 202
          body_match:
            status: pending_review
        capture:
          managed_message_id: message_id

      - id: get_managed_message_lifecycle
        action: request
        method: GET
        path: /v1/agents/bot@suppression-contract.test.dev/messages/{managed_message_id}/lifecycle
        expect:
          status: 200
          body_match:
            "items.length": 2
          # Both observations share the accept transaction's timestamp. The
          # wire contract therefore orders them by stable transition ID, not
          # by stage, so assert the canonical review row independent of index.
          body_array_contains:
            items:
              message_id: "{managed_message_id}"
              direction: outbound
              stage: review
              outcome: pending
              reason_code: review.hold_created
              retryable: false
              reconstructed: false

    cleanup:
      - id: delete_agent_permanently
        action: request
        method: DELETE
        path: /v1/agents/bot@suppression-contract.test.dev?confirm=DELETE&permanent=true
        expect:
          status: 200
          body_match:
            deleted: true
            email: bot@suppression-contract.test.dev

      - id: delete_domain
        action: request
        method: DELETE
        path: /v1/domains/suppression-contract.test.dev?confirm=DELETE
        expect:
          status: 200
          body_match:
            deleted: true
            domain: suppression-contract.test.dev

  - name: scheduled_send_fields
    description: >
      A future send_at is durably accepted as status=scheduled, echoes the
      normalized scheduled_at instant, and preserves scheduled_at on message
      detail and list projections. wait=sent must return the scheduled result
      immediately rather than waiting for the future instant.
    setup:
      - register_agent:
          email: scheduled-contract-{scenario_token}@agents.e2a.dev
    steps:
      - id: schedule_send
        action: request
        method: POST
        path: /v1/agents/{agent_email}/messages?wait=sent
        body:
          to:
            - recipient@example.net
          subject: scheduled send conformance
          text: delivered later
          send_at: "{future_rfc3339}"
        expect:
          status: 202
          body_excludes:
            - thread_id
          body_match:
            status: scheduled
            scheduled_at: "{future_rfc3339}"
        capture:
