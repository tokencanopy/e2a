name: Tests

on:
  push:
    # Restrict push trigger to main: feature-branch pushes only fire the
    # pull_request event (via synchronize) once a PR is open, avoiding
    # duplicate runs that GitHub Actions otherwise produces when both
    # events fire on the same SHA.
    branches: [main]
    paths-ignore:
      # Top-level docs only — keep CI running for SDK/CLI READMEs
      # since those ship to npm/PyPI as part of the package.
      - "README.md"
      - "CLAUDE.md"
      - "LICENSE"
      - "NOTICE"
  pull_request:
    paths-ignore:
      # Top-level docs only — keep CI running for SDK/CLI READMEs
      # since those ship to npm/PyPI as part of the package.
      - "README.md"
      - "CLAUDE.md"
      - "LICENSE"
      - "NOTICE"
  # Manual trigger (an API dispatch, not a webhook): lets operators re-run the
  # full battery on any ref when pull_request webhook delivery is unavailable
  # (e.g. a GitHub Actions incident throttles webhooks) or to re-verify a pinned
  # commit.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Every push compares against its immediate predecessor, so each push needs a
  # unique group: GitHub replaces older *pending* runs in a shared group even
  # when cancel-in-progress is false. PR runs are safe to supersede by ref.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  repository-integrity:
    name: Repository text integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: scripts/check-repository-text-integrity.sh
      - run: node --test scripts/sync-agent-docs.test.mjs

  harness-tests:
    name: Test harnesses (e2e-prod unit, sdk-monitor)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Network-free unit tests only — the e2e-prod suites against a live
      # deployment stay manual. No npm ci needed: node --test type-strips.
      - run: node --test tests/e2e-prod/harness/*.test.ts
      # Offline unit tests for the three coverage gates (synthetic shards,
      # red-without-contacts / green-when-complete). pyyaml is what the gates
      # themselves need to parse api/openapi.yaml.
      - run: |
          pip install pyyaml
          cd tests/e2e-prod && python3 -m unittest test_gates -v
      # monitor.py imports the Python SDK (from e2a.v1 import ...) — install
      # the repo's SDK so the gate tests this tree, not a published release.
      - run: |
          pip install ./sdks/python
          python3 tests/sdk-monitor/test_monitor.py

  go:
    name: Go tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: true
      - run: go test ./...

  go-coverage:
    name: Go coverage gate
    runs-on: ubuntu-latest
    # Headroom over observed: the parallel (-p 4, per-package DBs) cover run
    # is well under this; the cap exists so a hung suite can't burn an hour.
    timeout-minutes: 18
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: e2a
          POSTGRES_PASSWORD: e2a
          POSTGRES_DB: e2a_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U e2a -d e2a_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: true
      # Generate the coverage profile with the test DB available. Packages
      # run in parallel (-p 4): the testutil harness gives each package its
      # own database, self-provisioned from the service's e2a_test base.
      # Floors live in .testcoverage.yml.
      - name: Generate coverage profile
        run: make cover
      - name: Race-check ramp and outbound worker
        env:
          E2A_TEST_DATABASE_URL: postgres://e2a:e2a@localhost:5433/e2a_test?sslmode=disable
        run: go test -race -p 2 ./internal/sendramp ./internal/outboundsend
      - name: Enforce per-package coverage floors
        uses: vladopajic/go-test-coverage@v2
        with:
          config: ./.testcoverage.yml

  go-e2e:
    name: Go e2e tests
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: e2a
          POSTGRES_PASSWORD: e2a
          POSTGRES_DB: e2a_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U e2a -d e2a_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
      # The e2e suite exercises outbound send/reply, which the relay routes to an
      # upstream SMTP host. Mailpit (the same catch-all used in local dev via
      # docker-compose) stands in for SES; the tests point WithOutboundSMTP at
      # 127.0.0.1:1025.
      mailpit:
        image: axllent/mailpit:v1.30.0
        ports:
          - 1025:1025
          - 8025:8025
        options: >-
          --health-cmd "wget --quiet --spider http://localhost:8025/api/v1/info || exit 1"
          --health-interval 5s
          --health-timeout 2s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts --prefix plugins/e2a/skills/email-evals/runtime
      # Run every package containing an `integration`-tagged test. The Make
      # target discovers these packages from their build constraints, so tagged
      # tests outside internal/e2e cannot silently fall out of CI. Normal tests
      # are covered by the Go and coverage jobs above.
      - name: Run integration-tagged Go suite
        run: make test-e2e

  web:
    name: Web tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run verify:umami
      - run: npm run test:umami-updater
      - run: npm run verify:redoc
      - run: npm run test:redoc-updater
      - run: npm run lint
      - run: npm run test:coverage
      - run: npm run build

  ts-sdk:
    name: TypeScript SDK tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run build --workspace @e2a/sdk
      - run: npm run test:coverage --workspace @e2a/sdk

  agent-framework-examples:
    name: Minimal agent webhook examples
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            sdks/python/pyproject.toml
            examples/agent-framework-webhooks/python/pyproject.toml
      - uses: actions/setup-node@v7
        with:
          node-version: "22.12.0"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            examples/agent-framework-webhooks/typescript/package-lock.json
      - name: Install local Python SDK and example
        run: python -m pip install -e ./sdks/python -e './examples/agent-framework-webhooks/python[dev]'
      - name: Test and type-check Python examples
        working-directory: examples/agent-framework-webhooks/python
        run: |
          python -m pytest -q
          python -m mypy agent_webhooks tests
      - name: Dry-run Python webhook without provider credentials
        working-directory: examples/agent-framework-webhooks/python
        run: python -m agent_webhooks.dry_run
      - name: Build local TypeScript SDK
        run: |
          npm ci
          npm run build --workspace @e2a/sdk
      - name: Install, test, type-check, and build TypeScript examples
        working-directory: examples/agent-framework-webhooks/typescript
        run: |
          npm ci
          npm test -- --run
          npm run typecheck
          npm run build
      - name: Dry-run TypeScript webhook without provider credentials
        working-directory: examples/agent-framework-webhooks/typescript
        run: npm run dry-run

  adk-cloud-webhook-example:
    # This expanded tutorial deliberately pins ADK 1.x. A separate job keeps
    # its dependency environment isolated and verifies its own metadata.
    name: Expanded ADK 1.x webhook example
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            sdks/python/pyproject.toml
            examples/adk-cloud-webhook/pyproject.toml
      - name: Install local Python SDK and ADK tutorial
        run: python -m pip install -e ./sdks/python -e ./examples/adk-cloud-webhook
      - name: Verify ADK 1.x dependency resolution
        run: python -c 'import importlib.metadata as m; version = m.version("google-adk"); assert version.startswith("1."), version; print(f"google-adk={version}")'
      - name: Test expanded ADK webhook tutorial
        run: python -m unittest discover -s examples/adk-cloud-webhook -p 'test_*.py'

  ts-contract:
    name: TypeScript SDK contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: e2a
          POSTGRES_PASSWORD: e2a
          POSTGRES_DB: e2a_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U e2a -d e2a_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: Build contract server helper
        run: |
          cd "$GITHUB_WORKSPACE"
          go build -o /tmp/e2a-contract-server ./cmd/e2a-contract-server
      - name: Run contract tests against shared test server
        run: |
          set -euo pipefail
          envfile="$(mktemp)"
          logfile="$(mktemp)"
          cleanup() {
            if [ -n "${server_pid:-}" ]; then
              kill "${server_pid}" >/dev/null 2>&1 || true
              wait "${server_pid}" >/dev/null 2>&1 || true
            fi
          }
          trap 'status=$?; if [ $status -ne 0 ]; then echo "=== contract server log ==="; cat "$logfile"; fi; cleanup; exit $status' EXIT

          cd "$GITHUB_WORKSPACE"
          E2A_TEST_DATABASE_URL="postgres://e2a:e2a@127.0.0.1:5433/e2a_test?sslmode=disable" \
            /tmp/e2a-contract-server -env-file "$envfile" >"$logfile" 2>&1 &
          server_pid=$!

          for _ in $(seq 1 150); do
            if [ -s "$envfile" ]; then
              break
            fi
            if ! kill -0 "$server_pid" >/dev/null 2>&1; then
              break
            fi
            sleep 0.2
          done

          test -s "$envfile"
          set -a
          . "$envfile"
          set +a

          for _ in $(seq 1 20); do
            if curl -fsS "$E2A_TEST_BASE_URL/api/health" >/dev/null; then
              break
            fi
            sleep 0.2
          done

          cd "$GITHUB_WORKSPACE"
          npm run test:contract --workspace @e2a/sdk

  cli:
    name: CLI tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run build --workspace @e2a/sdk
      - run: npm run test:coverage --workspace @e2a/cli
      - run: npm run build --workspace @e2a/cli

  deps-sync:
    # Guardrail: in-repo consumers (mcp, cli) must declare an @e2a/sdk range the
    # workspace SDK satisfies, or npm links a STALE published SDK instead of the
    # workspace (the bug that shipped dnsRecords: {} over MCP after the SDK
    # majored to 4.0.0). Fails the moment the SDK majors without consumers bumping.
    name: Internal SDK version sync
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: node scripts/check-sdk-version-sync.mjs

  mcp:
    name: MCP server tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # The MCP compatibility gate reads the base catalog directly from
          # the comparison commit, like the OpenAPI compatibility job.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run build --workspace @e2a/sdk
      - run: node --test scripts/check-mcp-tool-compat.test.mjs
      - name: Reject removed MCP tools in pull requests
        if: github.event_name == 'pull_request'
        env:
          MCP_TOOL_BASE: ${{ github.event.pull_request.base.sha }}:mcp/tool-names.v1.json
        run: node scripts/check-mcp-tool-compat.mjs "$MCP_TOOL_BASE"
      - name: Reject removed MCP tools pushed to main
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        env:
          MCP_TOOL_BASE: ${{ github.event.before }}:mcp/tool-names.v1.json
        run: node scripts/check-mcp-tool-compat.mjs "$MCP_TOOL_BASE"
      - run: npm run test:coverage --workspace @e2a/mcp-server
      - run: npm run build --workspace @e2a/mcp-server

  spec:
    name: OpenAPI contract gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # oasdiff reads the base document directly from the comparison commit.
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: true
      # The /v1 OpenAPI document is emitted from the live Huma handlers and
      # committed at api/openapi.yaml; this gate fails if it drifts (run
      # `make spec` to regenerate). This replaces the legacy swag-annotation
      # freshness check: the swag pipeline (web/public/openapi.yaml + the SDK
      # codegen that consumes it) is being retired with the SDK /v1 port, so
      # web/public/openapi.yaml is frozen and no longer swag-freshness-checked
      # until that follow-up PR flips codegen onto api/openapi.yaml.
      - name: Check the /v1 spec is up to date
        run: make spec-check
      - name: Test the /v1 compatibility policy
        run: make openapi-compat-test
      - name: Reject breaking /v1 changes in pull requests
        if: github.event_name == 'pull_request'
        env:
          OPENAPI_BASE: ${{ github.event.pull_request.base.sha }}:api/openapi.yaml
          OASDIFF_FORMAT: githubactions
        run: make openapi-compat-check
      - name: Reject breaking /v1 changes pushed to main
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        env:
          OPENAPI_BASE: ${{ github.event.before }}:api/openapi.yaml
          OASDIFF_FORMAT: githubactions
        run: make openapi-compat-check

  python-sdk:
    name: Python SDK tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: sdks/python
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            sdks/python/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: mypy
      - run: pytest tests/ -v

  python-contract:
    name: Python SDK contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: e2a
          POSTGRES_PASSWORD: e2a
          POSTGRES_DB: e2a_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U e2a -d e2a_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    defaults:
      run:
        working-directory: sdks/python
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            sdks/python/pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Build contract server helper
        run: |
          cd "$GITHUB_WORKSPACE"
          go build -o /tmp/e2a-contract-server ./cmd/e2a-contract-server
      - name: Run contract tests against shared test server
        run: |
          set -euo pipefail
          envfile="$(mktemp)"
          logfile="$(mktemp)"
          cleanup() {
            if [ -n "${server_pid:-}" ]; then
              kill "${server_pid}" >/dev/null 2>&1 || true
              wait "${server_pid}" >/dev/null 2>&1 || true
            fi
          }
          trap 'status=$?; if [ $status -ne 0 ]; then echo "=== contract server log ==="; cat "$logfile"; fi; cleanup; exit $status' EXIT

          cd "$GITHUB_WORKSPACE"
          E2A_TEST_DATABASE_URL="postgres://e2a:e2a@127.0.0.1:5433/e2a_test?sslmode=disable" \
            /tmp/e2a-contract-server -env-file "$envfile" >"$logfile" 2>&1 &
          server_pid=$!

          for _ in $(seq 1 150); do
            if [ -s "$envfile" ]; then
              break
            fi
            if ! kill -0 "$server_pid" >/dev/null 2>&1; then
              break
            fi
            sleep 0.2
          done

          test -s "$envfile"
          set -a
          . "$envfile"
          set +a

          for _ in $(seq 1 20); do
            if curl -fsS "$E2A_TEST_BASE_URL/api/health" >/dev/null; then
              break
            fi
            sleep 0.2
          done

          cd "$GITHUB_WORKSPACE/sdks/python"
          # `-o addopts=` drops the unit-test coverage gate (pyproject addopts):
          # live-server contract runs are not coverage-measured.
          pytest tests/test_contract.py -v -o addopts=

  generated-code:
    name: Generated code freshness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            sdks/python/pyproject.toml
      - name: Install TS SDK dependencies
        run: npm ci
      - name: Check generated code is up to date
        run: make generate-sdk-check

  sdk-operation-coverage:
    # Guardrail: the generated layer is regenerated from api/openapi.yaml, but the
    # ergonomic client users actually call is hand-written — so a new operation can
    # land generated-but-unreachable with every other gate green. That is exactly
    # how deleteMessage shipped: #466 added the endpoint, #480 wired up only the
    # restore half, and the SDK READMEs documented a trash lifecycle you could not
    # actually trash with. Sibling of tests/e2e-prod/coverage_gate.py ("is every
    # operation EXERCISED?"); this one asks "is every operation EXPOSED?".
    name: SDK operation coverage
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Test operation ID normalization
        run: python3 -m unittest scripts/test_check_sdk_operation_coverage.py
      - name: Check every operation is reachable from both SDKs
        run: python3 scripts/check-sdk-operation-coverage.py

  design-system-dist:
    name: Design system dist freshness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
      # @e2a/ui's dist/ is committed (web consumes it via a file: dep and its
      # Docker image copies it). Rebuild and fail on drift, same idiom as the
      # OpenAPI/SDK freshness gates above.
      - name: Install workspace deps
        run: npm ci
      - name: Rebuild @e2a/ui
        run: npm run build --workspace @e2a/ui
      - name: Check dist/ is up to date
        run: git diff --exit-code design-system/dist
