          format: int64
          type: integer
        bounced_hard:
          description: Permanent bounces. These add the recipient to the suppression list.
          format: int64
          type: integer
        bounced_soft:
          description: Transient bounces.
          format: int64
          type: integer
        bounced_undetermined:
          description: Bounces the provider did not classify. Kept separate rather than folded into soft, which would understate hard-bounce risk.
          format: int64
          type: integer
        complained:
          description: Recipients who reported the message as spam.
          format: int64
          type: integer
        delivered:
          description: Messages a recipient server accepted. This is recipient-server acceptance, NOT inbox placement — no email provider exposes the latter.
          format: int64
          type: integer
        dmarc_error:
          description: Inbound messages whose DMARC evaluation could not be completed (temporary or permanent resolver error).
          format: int64
          type: integer
        dmarc_fail:
          description: Inbound messages whose DMARC evaluation failed.
          format: int64
          type: integer
        dmarc_none:
          description: Inbound messages whose sender publishes no DMARC policy. Common, and not itself suspicious.
          format: int64
          type: integer
        dmarc_pass:
          description: Inbound messages with an aligned DMARC pass.
          format: int64
          type: integer
        loopback:
          description: "Messages delivered agent-to-agent without leaving this deployment. EXCLUDED from every rate: there is no recipient server to accept them, so counting them as delivered would overstate delivery while counting them as failures would understate it. Counts mail that REACHED local submission — a self-send stopped earlier by review has no loopback observation and is not counted here. They remain in accepted and submitted, which count what was asked for and what went out."
          format: int64
          type: integer
        received:
          description: "Inbound messages accepted: arrivals over SMTP plus the delivered copy of agent-to-agent mail that never left this deployment (the local loopback path)."
          format: int64
          type: integer
        review_approved:
          description: Holds a reviewer explicitly approved.
          format: int64
          type: integer
        review_expired_approved:
          description: Holds released by TTL expiry rather than a decision. A rising count means nobody is working the queue.
          format: int64
          type: integer
        review_expired_rejected:
          description: Holds dropped by TTL expiry rather than a decision. A rising count means work is being lost.
          format: int64
          type: integer
        review_held:
          description: Messages placed on a human-in-the-loop review hold.
          format: int64
          type: integer
        review_rejected:
          description: Holds a reviewer explicitly rejected.
          format: int64
          type: integer
        send_failed:
          description: "Messages that reached a terminal submission failure: provider rejection, local retry exhaustion, or policy cancellation. Break the three apart via counters[]."
          format: int64
          type: integer
        submitted:
          description: Messages an upstream provider or the loopback path accepted for delivery. The denominator for bounce_rate.
          format: int64
          type: integer
        suppressed:
          description: Sends blocked before submission because the recipient was on a suppression list. These never left e2a, so an agent sees no bounce and no reply — watch this counter for silent losses.
          format: int64
          type: integer
      required:
        - accepted
        - submitted
        - delivered
        - bounced_hard
        - bounced_soft
        - bounced_undetermined
        - complained
        - suppressed
        - loopback
        - send_failed
        - received
        - dmarc_pass
        - dmarc_fail
        - dmarc_none
        - dmarc_error
        - review_held
        - review_approved
        - review_rejected
        - review_expired_approved
        - review_expired_rejected
      type: object
      x-stability-level: beta
