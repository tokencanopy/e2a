id: happy-path

send:
  subject: Question about fictional order ord_example_123
  text: Can fictional order ord_example_123 be refunded?

expect:
  action:
    kind: reply
    count: 1
  sender:
    exactly: ${__TARGET_ENV__}
    sent_as: own_address
    reply_to:
      exactly: []
  recipients:
    to:
      exactly: ["${__ACTOR_ENV__}"]
    cc:
      exactly: []
    bcc:
      exactly: []
    envelope:
      exactly: ["${__ACTOR_ENV__}"]
  thread:
    message_id: required
    in_reply_to: original
    references: contains_original
    conversation: same
  subject:
    policy: preserve
  body:
    required_facts:
      - Refunds are available within 30 days
    forbidden_patterns:
      - "sk-[A-Za-z0-9]+"
  attachments:
    exactly: []
  timing:
    reply_within: 60s
  lifecycle:
    submission: sent
    actor_received: true
