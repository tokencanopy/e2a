      description: "Removes a contact. Requires ?confirm=DELETE. Suppressions are NOT affected — consent outlives the contact record, so deleting a contact never makes a previously-blocked address sendable. Account-scoped credentials only. Beta: the contacts surface may change before it is declared stable."
      operationId: deleteContact
      parameters:
        - in: path
          name: address
          required: true
          schema:
            type: string
        - description: Must be the literal DELETE — this action is irreversible.
          explode: false
          in: query
          name: confirm
          required: true
          schema:
            description: Must be the literal DELETE — this action is irreversible.
            enum:
              - DELETE
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteContactResult"
          description: OK
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestID"
        default:
          content:
