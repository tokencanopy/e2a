[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "e2a"
version = "5.7.0"
description = "Python SDK for e2a — build AI agents with authenticated email"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.9"
authors = [{ name = "TokenCanopy", email = "josh@tokencanopy.com" }]
keywords = ["email", "agent", "authentication", "e2a", "webhook", "support-agent", "receptionist", "scheduling", "ecommerce", "sales", "recruiting", "voice-agent", "procurement"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Email",
]
dependencies = [
    "httpx>=0.24",
    "pydantic>=2.12,<3",
    # Runtime deps of the OpenAPI-Generator /v1 client base (e2a.v1.generated, httpx
    # library): date parsing, the Retry type in configuration, and Self on the
    # generated pydantic v2 models.
    "python-dateutil>=2.8",
    "urllib3>=1.25",
    "typing-extensions>=4.7",
]

[tool.hatch.build.targets.sdist]
# Defensive: local pytest-cov data files must never ship in the sdist (they
# embed absolute local paths). They are also gitignored; this guards a build
# from a tree where one exists anyway.
exclude = [".coverage*"]

[tool.hatch.build.targets.wheel]
# src layout: ship the e2a package (incl. PEP 561 py.typed markers at every
# hand-written level, not just the generated sub-package).
packages = ["src/e2a"]
artifacts = ["src/e2a/py.typed", "src/e2a/v1/py.typed", "src/e2a/v1/generated/py.typed"]

[project.urls]
Homepage = "https://e2a.dev"
Repository = "https://github.com/tokencanopy/e2a"
Documentation = "https://e2a.dev"

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov>=5", "pytest-httpx", "anyio[trio]", "pyyaml>=6", "build", "twine", "mypy>=1.10,<1.19"]
ws = ["websockets>=14"]

# Unit-test coverage gate (pytest-cov). The OpenAPI-Generator client base under
# e2a/v1/generated is excluded — it is regenerated from the spec, not
# hand-maintained, and has its own freshness gate in CI.
[tool.coverage.run]
source = ["e2a"]
omit = ["*/e2a/v1/generated/*"]

[tool.pytest.ini_options]
# Contract tests (tests/test_contract.py) self-skip without E2A_TEST_BASE_URL /
# E2A_TEST_API_KEY, so plain `pytest tests/` measures unit coverage only. The
# python-contract CI job overrides addopts (`-o addopts=`) so live-server runs
# are not coverage-gated.
addopts = "--cov=e2a --cov-fail-under=90"

[tool.mypy]
python_version = "3.9"
files = ["tests/test_e2e.py", "tests/typecheck_event_envelope.py", "tests/typecheck_inbound.py", "tests/typecheck_lifecycle_payloads.py"]
follow_imports = "silent"
show_error_codes = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["pytest", "pytest.*", "_pytest", "_pytest.*"]
follow_imports = "skip"

# CI installs dependencies under Python 3.12 while checking our public Python
# 3.9 surface. Newer anyio releases legitimately use 3.10+ syntax, so keep
# third-party implementation details out of this SDK request-shape gate.
[[tool.mypy.overrides]]
module = ["anyio", "anyio.*"]
follow_imports = "skip"
