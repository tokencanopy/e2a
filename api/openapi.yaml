            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Error
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestID"
      security:
        - bearer: []
      summary: Fire a synthetic event
      tags:
        - webhooks
